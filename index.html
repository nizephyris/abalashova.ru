<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Настя Балашова — продуктовый дизайнер</title>
<meta name="description" content="Продуктовый дизайнер с 3+ годами опыта. B2B-команда Яндекс Доставки.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="preload" as="image" href="assets/photo.jpg">
<style>
  /* Все размеры из макета 1440×1024 записаны в rem (1rem = 16px на 1440×1024)
     и масштабируются под окно. */
  :root {
    --glass: rgba(0, 0, 0, .47);
    --dim: rgba(255, 255, 255, .5);
    --font: "SF Pro Rounded", ui-rounded, "Nunito", system-ui, sans-serif;
    --ease: cubic-bezier(.3, .7, .2, 1);
    --note-anchor: 3rem;
    --button-font-size: 1.25rem;
    --note-width: 19rem;
  }
  html { font-size: clamp(11px, min(1.1111vw, 1.5625vh), 20px); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: #1b1b1d; color: #fff;
    font-family: var(--font); font-weight: 500;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  img { display: block; max-width: 100%; }

  .stage { position: relative; height: 100vh; height: 100svh; overflow: hidden; background: #e4e4e6; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 30%; }

  /* ── Иконки «рабочего стола» за карточкой ── */
  .desk { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .page-foot { display: none; }
  .desk-item {
    position: absolute; pointer-events: auto;
    display: flex; flex-direction: column; align-items: center; gap: .5rem;
    font-size: 1.25rem; text-shadow: 0 1px 8px rgba(0,0,0,.35);
    transition: transform .25s var(--ease);
  }
  .resume:focus-visible { transform: translateY(-.25rem); }
  .resume { left: 20.625rem; top: 12.5rem; }
  .resume img { width: 5rem; }
  .cat { left: 9.625rem; top: 25.4rem; width: 11.5rem; gap: 0; }
  /* Кот из макета: по умолчанию отвернулся (Variant3), при наведении смотрит в камеру (Variant2) */
  .cat-pic { position: relative; width: 100%; aspect-ratio: 184 / 144; }
  /* Как в Figma: «смотрящий» кот ложится поверх картинки с пледом и закрывает отвернувшегося */
  .cat-pic img { position: absolute; left: 7.07%; }
  .cat-away { top: 14.96%; width: 84.7%; }
  .cat-look { top: 0; width: 90.49%; visibility: hidden; }
  .cat:focus-visible .cat-look, .cat.look .cat-look { visibility: visible; }
  @media (hover: hover) and (pointer: fine) {
    .resume:hover { transform: translateY(-.25rem); }
    .cat:hover .cat-look { visibility: visible; }
  }

  /* ── Карточка ── */
  .card {
    position: absolute; left: 0; top: 0; bottom: 0; width: 32.5rem;
    background: var(--glass);
    -webkit-backdrop-filter: blur(26px) saturate(1.7); backdrop-filter: blur(26px) saturate(1.7);
    border-radius: 0 1.5rem 1.5rem 0; overflow: hidden;
    transition: width .5s var(--ease); z-index: 1;
  }
  .card-full, .card-mini { position: absolute; top: 0; bottom: 0; left: 0; transition: opacity .3s ease; }
  .card-full { width: 32.5rem; padding: 2.5rem; display: flex; flex-direction: column; }
  .card-mini { width: 7.5rem; opacity: 0; pointer-events: none; }
  .collapsed .card { width: 7.5rem; }
  .collapsed .card-full { opacity: 0; pointer-events: none; }
  .collapsed .card-mini { opacity: 1; pointer-events: auto; transition-delay: .15s; }

  /* если слово всё-таки не влезает в колонку — переносим его, а не обрезаем */
  .bio, .case-text { overflow-wrap: break-word; }
  .bio { font-size: 1.75rem; line-height: 1.2; color: var(--dim); }
  .bio p { margin: 0 0 1.25rem; }
  .bio b { font-weight: inherit; color: #fff; }
  .emo { display: inline-block; width: 1.1em; height: 1.1em; vertical-align: -.2em; margin-left: .1em; }
  .emo.big { width: 1.3em; height: 1.3em; vertical-align: -.3em; }
  .ext { white-space: nowrap; transition: color .2s; }
  .ext img { display: inline-block; width: 1em; vertical-align: -.12em; margin-left: .15em; opacity: .5; transition: opacity .2s; }
  .ext:hover { color: #fff; }
  .ext:hover img { opacity: 1; }

  .card-foot { flex: none; margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: 1.25rem; }
  .toggle {
    width: 2.5rem; height: 2.5rem; border-radius: .5rem; display: grid; place-items: center;
    transition: background .2s;
  }
  .toggle:hover { background: rgba(255,255,255,.1); }
  .toggle img { width: 100%; }
  .toggle.back img { transform: scaleX(-1); }

  .mini-name {
    position: absolute; top: 2.5rem; left: 50%; transform: translateX(-50%) rotate(180deg);
    writing-mode: vertical-rl; font-size: 1.75rem; white-space: nowrap; /* читается снизу вверх */
  }
  .card-mini .toggle { position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%); }

  /* ── Кнопки справа сверху ── */
  .top { position: absolute; top: 2.5rem; right: 2.5rem; display: flex; gap: 1.25rem; z-index: 2; }
  .pill {
    /* padding-bottom поднимает текст на половину своей величины: строка центруется
       по буквам, а не по строчному боксу с запасом под выносные элементы */
    height: 2.5rem; padding: 0 1.25rem .22rem; border-radius: .5rem;
    display: inline-flex; align-items: center; gap: .5rem;
    background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.9); backdrop-filter: blur(16px) saturate(1.9);
    font-size: var(--button-font-size); transition: background .2s;
  }
  .pill:hover { background: rgba(0,0,0,.75); }
  .pill img { width: 1.5rem; }
  .lang { width: 3.75rem; padding: 0 0 .22rem; justify-content: center; }
  .snd { width: 3.75rem; padding: 0; justify-content: center; }   /* иконка — ровно по центру */
  .snd svg { width: 1.5rem; height: 1.5rem; }
  .snd .snd-off, .snd[aria-pressed="false"] .snd-on { display: none; }
  .snd[aria-pressed="false"] .snd-off { display: block; }

  /* ── Папки ── */
  .folders { position: absolute; right: 2.5rem; bottom: 6.5rem; display: flex; gap: 2.5rem; }  /* +2rem: подпись теперь вне потока */
  .folder { position: relative; width: 12.75rem; }
  .folder.open { z-index: 1; }
  .f-link { position: relative; display: flex; width: 100%; flex-direction: column; align-items: center; gap: .5rem; font-size: 1.25rem; white-space: nowrap; }
  /* подпись висит под папкой и не влияет на высоту ряда: вторая строка не двигает папки */
  .folder-label { position: absolute; top: calc(100% + .5rem); left: -1rem; right: -1rem; text-align: center; }
  .folder-date-break, .desktop-notes { display: none; }
  .f-body {
    position: relative; width: 100%; aspect-ratio: 204 / 140; border-radius: 10% / 14.57%;
    container-type: inline-size; --p: calc(100cqw / 204);
    -webkit-backdrop-filter: blur(16px) saturate(1.9); backdrop-filter: blur(16px) saturate(1.9);
    transition: transform .35s var(--ease);
  }
  .folder.open .f-body { transform: translateY(-.4rem) rotate(-1.5deg); }
  .f-body > * { position: absolute; }
  .f-front { left: 0; bottom: 0; width: 100%; height: 76.36%; transition: transform .35s var(--ease); transform-origin: bottom; }
  .folder.open .f-front { transform: perspective(40rem) rotateX(-14deg); }
  .f-icons { inset: 0; transition: transform .35s var(--ease); transform-origin: bottom; }
  .folder.open .f-icons { transform: perspective(40rem) rotateX(-14deg); }
  .f-icons > * { position: absolute; }
  .red   { background: rgba(160, 69, 52, .2); }
  .green { background: rgba(82, 120, 0, .4); }
  .ya    { left: 2.5%; top: 30%; width: 27.45%; }
  /* Коробка собрана слоями ровно как в Figma: белая подложка (обводка) + красная коробка из двух кусков + эмблема.
     --p — один пиксель макета папки (папка 204px в Figma). */
  .box { left: calc(50 * var(--p)); top: calc(80 * var(--p)); width: calc(50.276 * var(--p)); aspect-ratio: 1; }
  .box-layer { position: absolute; display: grid; place-items: center; }
  .box-out { left: 0; top: 0; width: calc(50.276 * var(--p)); height: calc(50.276 * var(--p)); }
  .box-in { left: calc(3.37 * var(--p)); top: calc(3.37 * var(--p)); width: calc(43.529 * var(--p)); height: calc(43.529 * var(--p)); }
  .icon-box { position: relative; overflow: hidden; transform: rotate(171.28deg) scaleY(-1); }
  .box-out .icon-box { width: calc(44.1 * var(--p)); height: calc(44.1 * var(--p)); }
  .box-in .icon-box { width: calc(38.182 * var(--p)); height: calc(38.182 * var(--p)); }
  .icon-box > * { position: absolute; max-width: none; }
  /* белая обводка — силуэт той же коробки, на 15% больше и по тому же центру */
  .box-out .icon-box { filter: brightness(0) invert(1); }
  .s1, .s2 { overflow: hidden; top: 8.2%; height: 83.9%; }
  .s1 { left: 4.77%; width: 68.64%; }
  .s2 { left: 68.83%; width: 22.88%; }
  .s1 img, .s2 img { position: absolute; top: 0; height: 100%; max-width: none; }
  .s1 img { left: -0.2%; width: 133.73%; }
  .s2 img { left: -300.6%; width: 401.2%; }
  .u { left: 39.12%; width: 40.5%; top: calc(50% + 1.16 * var(--p)); transform: translateY(-50%); aspect-ratio: 30.86 / 35.77; }
  .otp   { left: 8.56%; top: 36.1%; width: 19.2%; transform: rotate(5.85deg); }
  .frog  { left: 65.5%; top: 64.9%; width: 24.25%; transform: rotate(-24.25deg); }
  .cu    { inset: 0; width: 100%; height: 100%; }

  /* ── Обложки проектов: стеклянные карточки встают над папкой в шахматном порядке ── */
  .fan { position: absolute; left: 50%; bottom: 100%; width: 0; height: 0; pointer-events: none;
         font-size: calc(var(--k, 1) * 1rem); }
  .fan-item {
    position: absolute; left: 0; bottom: 0; width: 12.75em;   /* ширина как у папки на десктопе */
    display: flex; flex-direction: column; align-items: center; text-align: center;
    opacity: 0; transform: translate(-50%, 0) scale(.35);
    transition: transform .46s cubic-bezier(.2, 1.18, .32, 1), opacity .22s ease;
  }
  .fan-cover {
    position: relative; width: 100%; aspect-ratio: 204 / 140; overflow: hidden;
    display: grid; place-items: center; border-radius: .8em;
    background: rgba(255, 255, 255, .06);
    -webkit-backdrop-filter: blur(7px) saturate(1.9); backdrop-filter: blur(7px) saturate(1.9);
    /* тонкая светлая кромка — она и читается как край стекла */
    box-shadow: 0 .5em 1.4em rgba(0, 0, 0, .28), inset 0 0 0 1px rgba(255, 255, 255, .22);
    transition: transform .25s var(--ease);
  }
  .fan-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .fan-emoji { font-size: 4em; line-height: 1; filter: drop-shadow(0 .1em .2em rgba(0,0,0,.45)); }
  .fan-name {
    margin-top: .5rem; /* 8px до подписи */ font-size: 1.25rem; text-align: center;
    line-height: 1.2; min-width: 100%;
    white-space: nowrap;      /* подпись всегда в одну строку, даже если шире карточки */
    text-shadow: 0 1px 8px rgba(0,0,0,.5);
  }
  .folder.open .fan { pointer-events: auto; }
  /* невидимый мостик, чтобы веер не закрывался, пока курсор идёт к карточкам */
  .folder.open .fan::before {
    content: ""; position: absolute; left: var(--bl, -12rem); width: var(--bw, 24rem);
    bottom: -1rem; height: var(--h, 0px);
  }
  .folder.open .fan-item {
    opacity: 1;
    transform: translate(calc(-50% + var(--x)), calc(-1 * var(--y))) rotate(var(--a));
    transition-delay: calc(var(--i) * 45ms);
  }
  .fan-item:focus-visible .fan-cover { transform: translateY(-.35em) scale(1.06); }
  @media (hover: hover) and (pointer: fine) {
    .fan-item:hover .fan-cover { transform: translateY(-.35em) scale(1.06); }
  }

  /* ── Заголовок кейса и кнопки внутри карточки (макет 85:19987) ── */
  .case-title { margin: 0; min-width: 0; overflow-wrap: break-word; font-size: 1.75rem; line-height: 1.19; font-weight: 600; }
  /* кнопка «назад» стоит слева от названия кейса */
  .case-head { display: none; }
  body[data-view="case"] .case-head { display: flex; align-items: flex-start; gap: .75rem; margin: 0 0 2.5rem; }
  /* шеврон центруется по первой строке названия — в двух строчках стоит там же, где в одной */
  .case-head .home-btn { margin-top: calc((1.75rem * 1.19 - 2.5rem) / 2); }

  /* ── Лента экранов кейса: прокрутка справа со своим индикатором ── */
  .case-feed {
    position: absolute; left: 32.5rem; top: 0; right: 0; bottom: 0;
    overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none;   /* экран всегда дотягивается целиком */
  }
  .case-feed::-webkit-scrollbar { display: none; }
  .case-screen { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; }
  /* экраны стоят по центру белой области — того, что осталось правее карточки */
  .scr-row { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* пара телефонов: 431,33×885,33 каждый, ровно 40px между ними */
  /* если вся композиция помещается в кадр 1400, он и занимает всю белую область */
  .scr-row.fit { --u: min(1px, (100cqw - 32.5rem) / var(--span, 1400), 100cqh / 1080); --n: var(--u); }
  .scr-pair { position: relative; display: flex; gap: calc(40 * var(--u)); height: calc(var(--ph-h, 885.333) * var(--u)); }
  .scr-item { position: relative; height: 100%; aspect-ratio: var(--ph-ar, 431.333 / 885.333); }
  /* снимок шире самого прибора (тень по бокам) — кладём его с выносом, чтобы корпус встал ровно */
  .scr-item.bleed { overflow: visible; }
  .scr-item.bleed > img { position: absolute; top: var(--sy, 0); left: var(--sx, 0);
                        width: var(--sw, 100%); height: auto; }
  /* окна с кадрами интерфейса — координаты из макета 1400×1080 */
  .scr-win { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             /* здесь кадр 1400 — это и есть белая область, без вылетов выносок за край */
             --u: min(1px, (100cqw - 32.5rem) / 1400, 100cqh / 1080); --n: var(--u);
             /* поле между кадром и правым краем экрана — кадр стоит по центру белой области */
             --edge: calc((100cqw - 32.5rem - 1400 * var(--u)) / 2); }
  /* выноска выравнивается правым краем по кнопке звука: 2,5rem до края + 3,75rem «ру» + 1,25rem зазор */
  .note.at-snd { right: calc(7.5rem - var(--edge)); left: auto; }
  .win-stage { position: relative; width: calc(1400 * var(--u)); height: calc(1080 * var(--u)); max-width: 100%; }
  .win {
    position: absolute; width: calc(600 * var(--u)); border-radius: calc(16 * var(--u)); overflow: hidden;
    background: #d5d5d5; color: #1d1d1d;
  }
  /* скриншот интерфейса со скруглением */
  .win-img { background: #fff; border: 1px solid #c9c9c9; border-radius: calc(24 * var(--u));
             display: flex; flex-direction: column; }
  /* Подрезаем контур в самом скриншоте, чтобы он не дублировал обводку рамки. */
  .win-stage:has(.win-img + .win-img) .win-shot {
    clip-path: inset(1px round calc(24 * var(--u)));
  }
  .win-shot { flex: 1; min-height: 0; width: 100%; display: block;
              object-fit: cover; object-position: top; }
  .stage-arrow { position: absolute; display: block; }
  /* выноски к окнам стоят по координатам макета 1400×1080, ширина — как в кейсе роботов */
  .win-stage .note { position: absolute; transform: none; z-index: 20; }   /* ширину задаёт сама выноска */
  .scr-item > img { width: 100%; height: 100%; display: block; }   /* сам снимок, не иконка выноски */
  /* первый экран: видео стоит само по себе — телефон уже внутри ролика.
     Радиус 120px от ширины 816 и высоты 1684 обрезает чёрные углы кадра */
  .scr-video {
    height: calc(885.333 * var(--u)); aspect-ratio: 816 / 1684;
    border-radius: 14.7% / 7.13%; overflow: hidden; background: #000;
  }
  .scr-video video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* первый экран, пока нет ролика: обложка кейса — та же, что в папке */
  .scr-cover { width: calc(1240 * var(--u)); max-width: 100%; aspect-ratio: 816 / 560; }
  .scr-cover picture { display: block; width: 100%; height: 100%; }
  .scr-cover img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* У всех PNG корпус 6312×3824, различаются только прозрачные поля. */
  .scr-cover.mac-cover {
    position: relative; aspect-ratio: 6312 / 3824;
    width: min(calc(1488 * var(--u)), calc(min(69.6cqh, 100cqh - 18rem) * 6312 / 3824));
    max-width: calc(100% - 2rem);
  }
  .mac-cover-art {
    position: absolute; top: 0; height: 100%;
    left: calc(-100% * var(--cover-inset) / 6312);
    width: calc(100% * var(--cover-width) / 6312);
  }
  .mac-cover-art img { max-width: none; }
  .mac-cover video {
    position: absolute; left: 12.0122%; top: 10.8787%;
    width: 76.7683%; height: 78.0858%; display: block; object-fit: fill;
  }
  /* Десктопные выноски к схемам и графу привязаны к координатам макета. */
  .note {
    position: absolute; z-index: 2;
    width: var(--note-anchor); height: var(--note-anchor);
    left: var(--nx); right: var(--nr); top: var(--ny);
  }
  .note-body {
    position: absolute; top: 0; left: 0; display: block;
    width: min(var(--note-width), calc(100cqw - 37.5rem));
    padding: calc(16 * var(--n)); border-radius: calc(16 * var(--n));
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(2); backdrop-filter: blur(18px) saturate(2);
    color: #fff;
    font-size: var(--button-font-size); line-height: 1.2;
  }
  .note-text { display: block; max-height: 4lh; overflow: auto; overflow-wrap: break-word; }
  .note.anch-r .note-body { left: auto; right: 0; }  /* выноска прижата правым краем */
  /* если плашка не помещается в кадр, её сдвигают внутрь — на кадр она просто заходит */
  .note-body { transform: translateX(var(--bshift, 0px)); }
  /* карточка-перевёртыш: по наведению глобус сменяется графом и проявляются выноски */
  .flip-card {
    position: absolute; overflow: hidden; cursor: pointer;
    border-radius: calc(45 * var(--u)); background: #efedea;
  }
  .flip-card img { position: absolute; inset: 0; width: 100%; height: 100%;
                     object-fit: cover; display: block; transition: opacity .35s var(--ease); }
  .flip-card .flip-back { opacity: 0; }
  /* на этом экране выноски не сворачиваются в кнопку: по наведению на глобус
     сразу видны все плашки целиком, как в макете */
  .flip-stage .note { opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
  .flip-stage.on .flip-front { opacity: 0; }
  .flip-stage.on .flip-back { opacity: 1; }
  .flip-stage.on .note { opacity: 1; pointer-events: auto; }
  .flip-stage .flip-hint { display: none; }
  .scr-title { display: none; }                     /* пары подписаны только на телефоне */
  .mobile-demo { display: none; }

  .case-bar {
    position: absolute; pointer-events: none;
    /* Полоса индикатора целиком правее минимального отступа выносок в 1rem. */
    right: .35rem;
    width: min(.45rem, calc(12 * var(--u))); height: calc(40 * var(--u));
    /* верхняя точка — ниже кнопок, чтобы сразу было видно, что экран прокручивается */
    top: 6.25rem;
    transform: translateY(calc(var(--p, 0) * (100cqh - 6.25rem - 80 * var(--u))));
    border-radius: calc(8 * var(--u)); background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(2); backdrop-filter: blur(18px) saturate(2);
  }

  /* ── Экран кейса (по макету 1440×1024) ── */
  .case {
    position: absolute; inset: 0; background: #fff; display: none; overflow: hidden;
    /* 1u — один пиксель макета: кадр 1400×1080 вписывается в свободное место справа */
    container-type: size;
    /* по ширине кадр считается от композиции: пара 902,67 + два вылета выносок,
       плюс поля, в которых помещается индикатор под кнопкой языка */
    --u: min(1px, (100cqw - 32.5rem - 5rem + 64px) / 1686.67, 100cqh / 1080);
    --n: var(--u);                                  /* выноски в том же масштабе, что телефоны */
  }
  body[data-view="case"] .case { display: block; animation: screen-in .24s var(--ease) both; }
  /* мягкая смена экранов: только прозрачность и сдвиг — без пересчёта раскладки */
  @keyframes screen-in { from { opacity: 0; transform: translateY(.5rem); } to { opacity: 1; transform: none; } }
  body[data-view="case"] .case-text { animation: screen-in .26s var(--ease) .03s both; }
  body[data-view="home"] .stage { animation: screen-in .24s var(--ease) both; }
  body[data-view="case"] .stage, body[data-view="case"] .desk { display: none; }
  body[data-view="case"] .bio { display: none; }
  body[data-view="case"] .card { transition: none; }
  body[data-view="case"] .case-text { display: flex; }
  .case-text { display: none; min-height: 0; }

  /* текст кейса: блоки через 20px, внутри блока 4px, всё 20px */
  .case-text { flex-direction: column; gap: 1.25rem; width: 27.5rem; font-size: 1.25rem; line-height: 1.19;
               overflow-y: auto; scrollbar-width: thin; }
  .screen-notes { display: none; }
  :is(.case-text, .screen-notes) section { display: flex; flex-direction: column; gap: .25rem; }
  .case-text h2, .screen-notes h4 { margin: 0; font-size: inherit; font-weight: inherit; color: var(--dim); }
  :is(.case-text, .screen-notes) p { margin: 0; }

  .desk-item { cursor: grab; user-select: none; -webkit-user-select: none; }
  .desk-item img { -webkit-user-drag: none; pointer-events: none; }
  .desk-item.dragging { cursor: grabbing; transition: none; transform: none; }

  .home-btn { flex: 0 0 auto; margin-left: -.5rem; }   /* шеврон слева от названия кейса */
  .back-fix { display: none; }                         /* на компьютере хватает шеврона у названия */
  body[data-view="case"] #collapse { display: none; }   /* шеврон внизу панели не нужен */

  a:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: .5rem; }

  /* ── Телефоны и узкие окна ── */
  @media (max-width: 760px), (max-aspect-ratio: 4/5) {
    :root { --button-font-size: 1rem; }
    html { font-size: 16px; }
    .stage { height: 78svh; min-height: 30rem; }
    .bg { object-position: 68% 25%; }
    /* ряд кнопок должен помещаться в ширину телефона вместе с «назад» слева */
    .top { top: 1rem; right: 1rem; gap: .375rem; }
    .pill { height: 2.25rem; padding: 0 .75rem .18rem; }
    .pill img { width: 1.25rem; }
    .lang { width: 2.5rem; padding: 0 0 .18rem; }
    .snd { width: 2.5rem; padding: 0; }
    .folders { left: 1rem; right: 1rem; bottom: 2.5rem; gap: .75rem; justify-content: space-between; }
    .folder { flex: 1; width: auto; min-width: 0; }
    .f-link { font-size: 1rem; white-space: normal; text-align: center; line-height: 1.2; }
    .folder-label { position: static; left: auto; right: auto; }   /* на телефоне подпись в потоке */
    .folder-date-break { display: inline; }
    .bio-break { display: none; }
    .f-body { width: 80%; }
    .fan-item { width: 8.5rem; }           /* пучок по тапу: карточки компактнее */
    /* на телефоне карточки стоят вплотную — подпись в одну строку наезжала бы на соседнюю */
    .fan-name { white-space: normal; min-width: 0; max-width: 100%; min-height: 2.4em;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .fan-name { font-size: 1rem; }

    .case-text { width: auto; font-size: 1.125rem; }
    /* на телефоне заголовок остаётся в чёрном блоке, как сейчас */
    .case-title { font-size: 1.5rem; }
    body[data-view="case"] .case-head { margin-bottom: 1.5rem; }
    /* панель на телефоне прокручивается, поэтому «назад» прибита к верху экрана */
    .case-head .home-btn { display: none; }
    body[data-view="case"] .back-fix {
      display: inline-flex; position: fixed; top: 1rem; left: 1rem; z-index: 50;
    }
    /* шапка прибита к экрану — кнопки видно на любой прокрутке */
    body[data-view="case"] .top { position: fixed; top: 1rem; bottom: auto; left: auto; right: 1rem; }
    /* на телефоне порядок такой: видео, описание проекта, потом экраны с выносками */
    body[data-view="case"] { background: #fff; }
    body[data-view="case"] .case, .case-feed { display: contents; }
    body[data-view="case"]:has(.scr-pair) {
      --case-max-width: max(16rem, (100svh - 5rem) / 2.0637);
    }
    body[data-view="case"] :is(.case-screen, .card, .page-foot) {
      width: calc(100% - 2rem); max-width: var(--case-max-width, none); margin-inline: auto;
    }
    .case-screen { height: auto; margin-bottom: 40px; order: 0; container-type: inline-size; }
    .scr-title { display: block; margin: 0 0 1.25rem; font-size: 1.5rem; line-height: 1.19;
                 font-weight: 600; color: #1b1b1d; }
    .case-screen:first-child { order: -2; padding-top: 4.5rem; margin-bottom: 40px; }
    body[data-view="case"] .card { order: -1; }
    .page-foot { order: 1; }
    /* Мокапы занимают ту же колонку, что и подписи. */
    .scr-row, .scr-pair { position: static; display: block; height: auto; }
    .scr-item, .scr-video { position: relative; width: 100%; height: auto; margin: 0 auto; }
    .scr-item + .scr-item { margin-top: 2.5rem; }
    .scr-cover { width: 100%; height: auto; margin: 0 auto; }
    .scr-cover.mac-cover { width: 100%; max-width: 100%; }
    .scr-item > img { height: auto; }
    .scr-item.bleed > img { position: static; width: 100%; }   /* на телефоне запас вокруг корпуса не нужен */
    /* Окна на телефоне идут столбиком во всю ширину. */
    .scr-win { position: static; display: block; height: auto; }
    .win-stage { position: static; width: auto; height: auto; max-width: none;
                 display: flex; flex-direction: column; gap: 1.25rem; }
    /* координаты из макета тут не нужны: окна идут одно под другим во всю ширину */
    .win { position: static; border-radius: 1rem;
           left: auto !important; top: auto !important;
           width: auto !important; height: auto !important; }
    .win-img { border-radius: 1rem; }
    .win-stage:has(.win-img + .win-img) .win-shot { clip-path: inset(1px round 1rem); }
    .win-shot { height: auto; object-fit: contain; }
    /* Глобус с графом на телефоне занимает всю ширину. */
    .flip-card { position: relative; border-radius: 1rem; aspect-ratio: 711 / 790;
                 left: auto !important; top: auto !important;
                 width: auto !important; height: auto !important; }
    .stage-arrow, .note { display: none; }
    .screen-notes {
      display: flex; flex-direction: column; gap: 1rem;
      margin: 0 0 1.5rem; color: #1b1b1d;
      font-size: 1.125rem; line-height: 1.25; overflow-wrap: break-word;
    }
    .screen-notes h4 { font-size: 1rem; color: #626267; }

    .has-mobile-demo > .win-stage { display: none; }
    .mobile-demo { display: block; color: #1b1b1d; }
    .demo-button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 2.75rem; padding: .5rem .875rem; border-radius: .625rem;
      background: #f1f1f2; font-size: var(--button-font-size); line-height: 1.2;
    }
    .demo-button[aria-disabled="true"] { opacity: .5; cursor: default; }
    .mobile-demo :focus-visible, .balance-demo:focus-visible {
      outline: 2px solid #1b1b1d; outline-offset: 3px;
    }
    .demo-shot { display: block; overflow: hidden; border: 1px solid #c9c9c9; border-radius: 1rem; }
    .demo-shot img { width: 100%; height: auto; clip-path: inset(3px round 1rem); }

    .balance-demo { width: 100%; text-align: left; -webkit-tap-highlight-color: transparent; }
    .balance-demo .demo-button { margin-bottom: .75rem; }
    .balance-faces { display: grid; }
    .balance-face {
      grid-area: 1 / 1; display: grid; align-content: start; gap: .5rem;
      transition: opacity .25s var(--ease);
    }
    .balance-face[aria-hidden="true"] { opacity: 0; }

    .contract-nav {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center;
      gap: .5rem; margin-bottom: .75rem;
    }
    .contract-position { margin: 0; color: #626267; text-align: center; }
    .contract-steps {
      display: flex; overflow-x: auto; overscroll-behavior-x: contain;
      scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none;
    }
    .contract-steps::-webkit-scrollbar { display: none; }
    .contract-step { flex: 0 0 100%; min-width: 0; margin: 0; scroll-snap-align: start; }
    .contract-step figcaption { margin: 0 0 .75rem; font-size: 1rem; line-height: 1.3; }

    .partner-demo {
      display: grid; gap: 1rem; margin: 0; padding: 1rem;
      border: 1px solid #c9c9c9; border-radius: 1rem;
    }
    .partner-demo .demo-fill { justify-self: start; }
    .partner-demo label { display: grid; gap: .375rem; min-width: 0; }
    .partner-demo :is(input, select) {
      width: 100%; min-width: 0; min-height: 2.75rem; padding: .5rem .75rem;
      border: 1px solid #bdbdc2; border-radius: .5rem; background: #fff;
      color: #1b1b1d; font: inherit;
    }
    .partner-details { display: grid; gap: 1rem; min-width: 0; margin: 0; padding: 0; border: 0; }
    .partner-save { width: 100%; background: #08763d; color: #fff; }
    .partner-status { margin: 0; color: #08763d; }
    .partner-status:not(:empty) { margin-top: .5rem; }

    .case-bar { display: none !important; }
    body[data-view="case"] .card { background: #1b1b1d; }
    .card, .collapsed .card {
      position: relative; width: auto; min-height: 0;
      margin-top: -1.5rem; border-radius: 1.5rem 1.5rem 0 0;
      background: #1b1b1d;
    }
    /* в кейсе чёрный блок — отдельная карточка с отступом 40px до телефонов */
    body[data-view="case"] .card { margin-block: 0 40px; border-radius: 1.5rem; }
    .card-full { position: static; width: auto; padding: 40px 1.25rem; }
    .card-mini, .toggle { display: none; }
    .collapsed .card-full { opacity: 1; pointer-events: auto; }
    .bio { font-size: 1.375rem; }

    /* на телефоне «2026, всё своими лапками» уезжает в самый низ экрана */
    body { display: flex; flex-direction: column; min-height: 100svh; }
    .stage, .card, .desk, .page-foot { flex: none; }
    .desk { position: static; display: flex; gap: 1.5rem; align-items: flex-end; padding: 0 1.25rem 1.5rem; background: #1b1b1d; }
    .page-foot {
      display: block; margin-top: auto; background: #1b1b1d; color: var(--dim);
      font-size: 1rem; padding: 0 1.25rem 1.5rem;
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
    }
    /* в кейсе футер — такая же карточка: 40px сверху, скруглённый верх, ниже ничего нет */
    body[data-view="case"] .page-foot {
      margin-block: 40px 0; border-radius: 1.5rem 1.5rem 0 0; padding-top: 1.5rem;
    }
    .case-screen:last-of-type { margin-bottom: 0; }   /* отступ до футера задаёт сам футер */
    .card-foot { display: none; }
    .desk-item { position: static; font-size: 1rem; }
    .resume img { width: 3.5rem; }
    .cat { width: 7rem; }
  }

  @media (max-width: 360px) {
    body[data-view="case"] .top { right: .75rem; gap: .25rem; }
    body[data-view="case"] .top :is(.cv, [data-link="contact"]), body[data-view="case"] .back-fix { padding-inline: .625rem; }
    body[data-view="case"] .back-fix { left: .75rem; }
  }
  @media (max-width: 308px) {
    body[data-view="case"] .top { right: .5rem; gap: .1875rem; }
    body[data-view="case"] .top :is(.cv, [data-link="contact"]) { padding-inline: .5rem; }
    body[data-view="case"] .back-fix { left: .5rem; width: 2.25rem; padding: 0; justify-content: center; font-size: 0; }
    .back-fix::after {
      content: ""; width: 1.5rem; height: 1.5rem;
      background: url("assets/ic-arrow.svg") center / contain no-repeat;
      transform: scaleX(-1);
    }
  }

  @media (width > 760px) and (aspect-ratio > 4/5) {
    .diagram-row {
      --u: min(1.15px, (100cqw - 32.5rem - 3rem) / 1220, 100cqh / 1000);
    }
    .diagram-row .win-stage {
      max-width: none; flex: none;
      transform: translateX(calc(var(--center-x, 0) * var(--u)));
    }
    .case-screen.has-desktop-notes {
      display: grid;
      grid-template: "media notes" minmax(0, 1fr) / minmax(0, 1fr) var(--note-width);
      min-height: 100%; height: auto;
      gap: 1.25rem;
      padding: 5.5rem 3.5rem 2rem 1.5rem;
      align-items: center;
    }
    .has-desktop-notes > .scr-row {
      position: relative; inset: auto; grid-area: media; align-self: stretch;
      min-width: 0; min-height: 0; container-type: size;
      --u: min(1px, 100cqw / var(--frame-width, 1400), 100cqh / 1080);
      --n: var(--u);
    }
    .desktop-notes { display: grid; grid-area: notes; gap: .75rem; min-width: 0; }
    .desktop-note-group { display: grid; gap: .75rem; min-width: 0; }
    .desktop-note {
      width: min(100%, var(--note-width));
      justify-self: center;
      padding: .75rem .85rem; border-radius: .75rem;
      background: #666; color: #fff;
      font-size: var(--button-font-size); line-height: 1.2;
    }
    .case-feed.go-feed {
      container: go-feed / size;
      --go-pair-ratio: calc((2 * 431.333 + 40) / 885.333);
      --go-phone-height: min((100cqw - 3rem) / var(--go-pair-ratio), clamp(15rem, 52svh, 34rem));
    }
    .case-screen.go-pair {
      --go-side-padding: 1.5rem;
      grid-template: "media" var(--go-phone-height) "notes" auto / minmax(0, 1fr);
      padding-inline: var(--go-side-padding);
      align-content: center;
    }
    .go-pair > .scr-row {
      container-type: normal;
      --u: calc(var(--go-phone-height) / 885.333);
    }
    .go-feed .scr-video { height: var(--go-phone-height); }
    .go-pair .desktop-notes { grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--note-width)), 1fr)); }
    .go-pair .desktop-note-group { display: contents; }
  }
  @media (min-width: 1280px) and (aspect-ratio > 4/5) {
    .case-screen.has-two-note-groups:not(.go-pair) {
      grid-template: "left media right" minmax(0, 1fr) / 14.5rem minmax(0, 1fr) 14.5rem;
      column-gap: .75rem;
    }
    .has-two-note-groups:not(.go-pair) .desktop-notes { display: contents; }
    .has-two-note-groups:not(.go-pair) .desktop-note-group { width: var(--note-width); z-index: 1; }
    .has-two-note-groups:not(.go-pair) .desktop-note-group:first-child { grid-area: left; justify-self: start; }
    .has-two-note-groups:not(.go-pair) .desktop-note-group:last-child { grid-area: right; justify-self: end; }
    .has-two-note-groups:not(.go-pair) .desktop-note-group:has(.desktop-note:only-child) {
      transform: translateY(clamp(-4rem, calc((var(--note-y, .5) - .5) * 48svh), 7rem));
    }
  }
  @container go-feed (min-width: 68rem) {
    .go-feed > .case-screen {
      --go-phone-height: min((100cqw - 33rem) / var(--go-pair-ratio), 100cqh - 10.5rem);
    }
    .case-screen.go-pair {
      --go-pair-width: calc(var(--go-phone-height) * var(--go-pair-ratio));
      /* Выноски немного заходят на корпус, оставляя место у индикатора прокрутки. */
      --go-note-overlap: max(1rem, calc(var(--note-width) + var(--go-side-padding) - (100cqw - var(--go-pair-width)) / 2));
      grid-template: "left media right" var(--go-phone-height) / minmax(0, 1fr) var(--go-pair-width) minmax(0, 1fr);
      gap: 0;
      padding: 0 var(--go-side-padding);
    }
    .go-pair .desktop-notes { display: contents; }
    .go-pair .desktop-note-group:empty { display: none; }
    .go-pair .desktop-note-group {
      --group-position: clamp(0, var(--note-y, .5), 1);
      display: grid;
      position: relative;
      align-self: start;
      top: calc(var(--go-phone-height) * var(--group-position));
      width: var(--note-width);
      z-index: 1;
      transform: translateY(calc(-100% * var(--group-position)));
    }
    .go-pair .desktop-note-group:first-child {
      grid-area: left; justify-self: end; margin-inline-end: calc(-1 * var(--go-note-overlap));
    }
    .go-pair .desktop-note-group:last-child {
      grid-area: right; justify-self: start; margin-inline-start: calc(-1 * var(--go-note-overlap));
    }
  }
  @media (760px < width < 1100px) and (aspect-ratio > 4/5) {
    .case-screen.has-desktop-notes:not(.go-pair) {
      grid-template: "media" clamp(15rem, 52svh, 34rem) "notes" auto / minmax(0, 1fr);
      padding-inline: 1.5rem 3rem;
    }
    .desktop-notes { grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--note-width)), 1fr)); }
    .desktop-note-group { display: contents; }
  }

  @media (width > 760px) and (aspect-ratio > 4/5) {
    .flip-stage:not(.on) .flip-hint { display: block; opacity: 1; }
    .case-screen.mac-screen.has-desktop-notes { display: block; height: 100%; padding: 0; }
    .mac-screen.has-desktop-notes > .scr-row.fit {
      position: absolute; inset: 0; container-type: normal;
      --u: min(1px, (100cqw - 32.5rem) / 1400, 100cqh / 1080);
    }
    .mac-screen .desktop-notes {
      position: absolute; right: 2.5rem; bottom: 1.25rem;
      max-width: calc(100% - 4rem);
      grid-auto-flow: column; grid-auto-columns: minmax(0, var(--note-width));
    }
    .mac-screen .desktop-note-group { display: contents; }
  }
  @media (760px < width < 1100px) and (aspect-ratio > 4/5) {
    .mac-note-alternate .desktop-notes { right: 1rem; max-width: calc(100% - 2rem); }
  }
  @media (min-width: 1100px) and (aspect-ratio > 4/5) {
    .mac-note-overlay .desktop-notes {
      top: 50%; right: 1.5rem; bottom: auto; transform: translateY(-50%);
    }
    .mac-note-alternate .desktop-notes {
      display: block; inset: 0; max-width: none; pointer-events: none;
    }
    .mac-note-alternate .desktop-note {
      position: absolute; left: 1.5rem; top: 35%; width: var(--note-width);
      transform: translateY(-50%); pointer-events: auto;
    }
    .mac-note-alternate .desktop-note:nth-child(2) { left: auto; right: 1.5rem; top: 50%; }
    .mac-note-alternate .desktop-note:nth-child(3) { top: 65%; }
  }

  /* низкое окно: шесть блоков кейса должны помещаться без прокрутки */
  @media (min-width: 761px) and (max-height: 760px) {
    .card-full { padding: 1.75rem 2.5rem; }
    .case-text { gap: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .contract-steps { scroll-behavior: auto; }
  }
</style>

      </button>

        <span class="f-icons">
          <img class="otp" src="assets/otp-logo.svg" alt="">
          <img class="frog" src="assets/frog.svg" alt="">

  const SHORT = /(?<=^|[\s\u00A0«(])((?:[\dA-Za-zА-Яа-яЁё+]{1,3}|через|между|перед|после|внутри|вместо|среди|около|вокруг|ради|кроме|вдоль|против|благодаря|согласно|with|from|into|onto|over|under|about|after|before|during|between|through|across|around|among|alongside)[,;:]?) /gi;
  function typograph(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => /^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)
        ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
    });
    for (let n; (n = walker.nextNode());) {
      n.nodeValue = n.nodeValue.replace(SHORT, '$1\u00A0').replace(/ —/g, '\u00A0—');
    }
  }

  const Sound = (() => {
    let ctx, out, on = store.get('sound') !== 'off';
    const last = {};

    function unlock() {
      if (!on) return;
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        out = ctx.createGain(); out.gain.value = .6;
        out.connect(comp).connect(ctx.destination);
      }
      if (ctx.state !== 'running') ctx.resume().catch(() => {});
    }
    // браузеры включают звук только после первого действия пользователя
    ['pointerdown', 'click', 'keydown']
      .forEach(e => addEventListener(e, unlock, { passive: true, capture: true }));
    document.addEventListener('visibilitychange', () => { if (!document.hidden && on && ctx) unlock(); });
    // не даём одному звуку трещать, если курсор дёргается
    const throttle = (key, ms) => { const t = performance.now(); if (t - (last[key] || 0) < ms) return false; last[key] = t; return true; };

    function env(g, t, peak, a, d) {
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
    }
    function tone(freq, { type = 'sine', dur = .15, gain = .15, attack = .004, to, delay = 0 } = {}) {
      const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      env(g, t, gain, attack, dur);
      o.connect(g).connect(out); o.start(t); o.stop(t + attack + dur + .05);
    }
    function noise({ dur = .2, gain = .1, type = 'bandpass', from = 1000, to = from, q = 1, delay = 0 } = {}) {
      const t = ctx.currentTime + delay, len = Math.ceil(ctx.sampleRate * (dur + .05));
      const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = buf; f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
      env(g, t, gain, dur * .3, dur * .7);
      src.connect(f).connect(g).connect(out); src.start(t); src.stop(t + dur + .05);
    }

    // три папки звучат нотами одного аккорда (до мажор)
    const NOTES = [523.25, 659.25, 783.99];

    const sfx = {
      tick()       { tone(2200, { dur: .025, gain: .04 }); },
      folderHover(i) {
        const f = NOTES[i] || NOTES[0];
        tone(f, { dur: .22, gain: .12 }); tone(f * 2, { type: 'triangle', dur: .12, gain: .03 });
      },
      folderOpen(i) {
        const f = NOTES[i] || NOTES[0];
        tone(f, { dur: .12, gain: .12 }); tone(f * 1.5, { dur: .25, gain: .1, delay: .07 });
      },
      collapse() {
        noise({ dur: .35, gain: .12, from: 2400, to: 300, q: 1.2 });
        tone(200, { dur: .18, gain: .12, to: 110, delay: .22 });
      },
      expand() {
        noise({ dur: .35, gain: .12, from: 300, to: 2400, q: 1.2 });
        tone(330, { dur: .12, gain: .08, to: 520, delay: .2 });
      },
      lang(up) {
        const [a, b] = up ? [660, 990] : [990, 660];
        tone(a, { dur: .07, gain: .08 }); tone(b, { dur: .1, gain: .08, delay: .07 });

        noise({ dur: .07, gain: .07, type: 'highpass', from: 3000, q: .7 });
        noise({ dur: .09, gain: .05, type: 'highpass', from: 4000, q: .7, delay: .08 });
      },
      meow() {
        // «мяу»: пила через формантные фильтры, высота растёт и спадает
        const t = ctx.currentTime, dur = .6;
        const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();

        o.frequency.setValueAtTime(420, t);
        o.frequency.linearRampToValueAtTime(760, t + .14);
        o.frequency.linearRampToValueAtTime(700, t + .3);
        o.frequency.exponentialRampToValueAtTime(430, t + dur);
        const vib = ctx.createOscillator(), vg = ctx.createGain();
        vib.frequency.value = 6; vg.gain.value = 12; vib.connect(vg).connect(o.frequency);
        lp.type = 'lowpass'; lp.Q.value = 4;
        lp.frequency.setValueAtTime(500, t);
        lp.frequency.linearRampToValueAtTime(3200, t + .12);
        lp.frequency.exponentialRampToValueAtTime(900, t + dur);
        const f1 = ctx.createBiquadFilter(), f2 = ctx.createBiquadFilter();
        f1.type = f2.type = 'bandpass'; f1.Q.value = 6; f2.Q.value = 8;
        f1.frequency.setValueAtTime(800, t); f1.frequency.linearRampToValueAtTime(1100, t + .15); f1.frequency.linearRampToValueAtTime(750, t + dur);
        f2.frequency.setValueAtTime(1900, t); f2.frequency.linearRampToValueAtTime(2500, t + .15); f2.frequency.linearRampToValueAtTime(1800, t + dur);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(.28, t + .06);
        g.gain.setValueAtTime(.28, t + .35);
        g.gain.exponentialRampToValueAtTime(.0001, t + dur);
        o.connect(lp); lp.connect(f1).connect(g); lp.connect(f2).connect(g); g.connect(out);
        o.start(t); vib.start(t); o.stop(t + dur + .05); vib.stop(t + dur + .05);

      play(name, arg, gap = 60) {

        if (throttle(key, gap)) sfx[name](arg);

      set on(value) {

        store.set('sound', on ? 'on' : 'off');
      },
      unlock,

  // обложки встают над папкой шахматкой: по две в ряд, ряды поднимаются вверх
  // и слегка уходят вправо. Если стопка не помещается, она уменьшается и сдвигается целиком.
  function layoutFan(fan) {
    const items = [...fan.children], n = items.length;
    const folder = fan.parentElement;
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    const pad = 12;

    fan.style.setProperty('--k', 1);
    const w = items[0].offsetWidth, h = items[0].offsetHeight;
    if (!w || !h) return;      // экран кейса прячет папки — считать тут нечего

    const gap = 2.5 * rem;                 // 40px от папки до нижнего ряда
    const colGap = 2.5 * rem, rowGap = .31 * h, lean = .19 * w;   // 40px между обложками
    const cols = n > 1 ? 2 : 1;
    // лёгкий хаос: у каждой карточки свой сдвиг — всегда один и тот же
    const noise = (el, salt) => {
      let h = 2166136261;
      for (const ch of (el.dataset.seed || '') + salt) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
      return ((h >>> 0) % 2000) / 1000 - 1;                        // −1…1
    };
    const toRight = fan.dataset.dir === 'right';
    const pt = i => {
      const row = Math.floor(i / cols), col = i % cols;
      const inRow = Math.min(cols, n - row * cols);                // в верхнем ряду бывает одна
      // ближняя к папке обложка стоит по её центру, остальные уходят в сторону через 40px
      const slot = toRight ? col : col - (inRow - 1);
      return {
        x: slot * (w + colGap) + (toRight ? -row * lean : row * lean)
           + noise(items[i], 'x') * .03 * w,
        y: gap + row * (h + rowGap) + noise(items[i], 'y') * .02 * h,
      };
    };
    const tilt = i => noise(items[i], 'a') * 1.6;

    let top = 0, left = 0, right = 0;
    items.forEach((el, i) => {
      const p = pt(i);
      top = Math.max(top, p.y + h);
      left = Math.min(left, p.x - w / 2);
      right = Math.max(right, p.x + w / 2);
    });

    const available = Math.max(0, folder.getBoundingClientRect().top - pad);
    const k = Math.min(1, available / top, (innerWidth - 2 * pad) / (right - left));
    fan.style.setProperty('--k', k.toFixed(3));

    const originX = fan.getBoundingClientRect().left;
    let shift = Math.min(0, innerWidth - pad - (originX + k * right));
    shift = Math.max(shift, pad - (originX + k * left));

    items.forEach((el, i) => {
      const p = pt(i);
      el.style.setProperty('--x', (k * p.x + shift).toFixed(1) + 'px');
      el.style.setProperty('--y', (k * p.y).toFixed(1) + 'px');
      el.style.setProperty('--a', tilt(i).toFixed(1) + 'deg');
    });
    // невидимый мостик под пучком, чтобы он не закрывался, пока курсор идёт к карточке
    fan.style.setProperty('--h', (k * top + rem).toFixed(1) + 'px');
    fan.style.setProperty('--bl', (k * left + shift - rem).toFixed(1) + 'px');
    fan.style.setProperty('--bw', (k * (right - left) + 2 * rem).toFixed(1) + 'px');
  }

  function createImage(src, className, first = false) {
    const img = document.createElement('img');
    img.className = className;
    img.alt = '';
    img.decoding = 'async';
    img.loading = first ? 'eager' : 'lazy';
    if (first) img.fetchPriority = 'high';

    const laptop = src.endsWith('-mac.png');
    if (!laptop && src !== 'assets/tg-globe-clean.png') {
      img.src = src;
      return img;
    }

    const picture = document.createElement('picture');
    const source = document.createElement('source');
    const stem = src.slice(0, -4);
    source.type = 'image/webp';
    if (laptop) {
      source.srcset = stem + '-1600.webp 1600w, ' + stem + '-3200.webp 3200w';
      source.sizes = '(max-width: 760px) 100vw, (max-aspect-ratio: 4/5) 100vw, (max-width: 2050px) 72vw, 1488px';
    } else source.srcset = stem + '.webp';
    img.addEventListener('error', () => source.remove(), { once: true });
    picture.append(source, img);
    img.src = src;
    return picture;
  }

  function syncVideo(video, state) {
    if (!state.visible || document.hidden) {
      if (!video.paused) {
        state.resume = true;
        video.pause();
      }
    } else if (state.resume) {
      state.resume = false;
      video.play().catch(() => {});
    }
  }

  const videoObserver = new IntersectionObserver(entries => {
    for (const entry of entries) {
      const state = videos.get(entry.target);
      if (!state) continue;
      state.visible = entry.isIntersecting && entry.intersectionRatio >= .15;
      syncVideo(entry.target, state);
    }
  }, { threshold: .15 });

  document.addEventListener('visibilitychange', () => {
    videos.forEach((state, video) => syncVideo(video, state));
  });

  // Готовим соседние экраны заранее, в том числе при прокрутке внутри ленты.
  const slideObserver = new IntersectionObserver(entries => {
    for (const { target, isIntersecting } of entries) {
      if (!isIntersecting || !target.isConnected) continue;
      for (const slide of [target.previousElementSibling, target, target.nextElementSibling]) {
        slide?.querySelectorAll('img[loading="lazy"]').forEach(img => { img.loading = 'eager'; });
      }
    }
  });

  function clearFeed() {
    slideObserver.disconnect();
    videoObserver.disconnect();
    videos.forEach((state, video) => {
      video.pause();
      video.removeAttribute('src');
      video.load();
    });
    videos.clear();
    caseCopy.clear();
    feed.replaceChildren();
  }

    video.src = screen.video;
    videos.set(video, { visible: false, resume: true });
    return video;
  }

  function positionWindow(el, frame) {
    el.style.left = percent(frame.x, 1400);

  function createFlip(screen) {
    const stage = document.createElement('div');
    stage.className = 'win-stage flip-stage';
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'flip-card';
    card.dataset.i18nLabel = 'graph';
    card.setAttribute('aria-label', T[lang].graph);
    card.setAttribute('aria-pressed', 'false');
    positionWindow(card, screen.flip);
    const back = createImage(screen.flip.back, 'flip-back');
    card.append(createImage(screen.flip.front, 'flip-front'), back);
    stage.appendChild(card);

    for (const copy of screen.notes) {
      const note = createNote(copy);
      if (copy.hint) note.classList.add('flip-hint');
      if (copy.r != null) {
        note.style.setProperty('--nr', percent(copy.r, 1400));
        note.classList.add('anch-r');
      } else note.style.setProperty('--nx', percent(copy.x, 1400));
      note.style.setProperty('--ny', percent(copy.y, 1080));
      stage.appendChild(note);
    }

    let wantsGraph = false;
    function showGraph(show) {
      wantsGraph = show;
      if (!show) {
        stage.classList.remove('on');
        card.setAttribute('aria-pressed', 'false');
        return;
      }
      back.loading = 'eager';
      back.decode().then(() => {
        if (!wantsGraph || !stage.isConnected) return;
        stage.classList.add('on');
        card.setAttribute('aria-pressed', 'true');
      }).catch(() => {});
    }
    card.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showGraph(true); });
    stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') showGraph(false); });
    card.addEventListener('click', e => {
      showGraph(e.pointerType === 'mouse' && e.detail ? true : !wantsGraph);
    });
    card.addEventListener('keydown', e => { if (e.key === 'Escape') showGraph(false); });
    return stage;
  }

  function createWindows(screen, first) {
    const stage = document.createElement('div');
    stage.className = 'win-stage';
    const frames = screen.frames;
    const left = Math.min(...frames.map(frame => frame.x));
    const right = Math.max(...frames.map(frame => frame.x + frame.w));
    stage.style.setProperty('--center-x', 700 - (left + right) / 2);
    frames.forEach((frame, i) => {
      const box = document.createElement('div');
      box.className = 'win win-img';
      box.style.zIndex = frames.length - i;
      // В координатах макета у окна была шапка высотой 60.
      positionWindow(box, { ...frame, y: frame.y + 60, h: frame.h - 60 });
      const shot = createImage(frame.src, 'win-shot', first);
      [shot.width, shot.height] = frame.size;
      box.appendChild(shot);
      stage.appendChild(box);
    });
    for (const arrow of screen.arrows || (screen.arrow ? [screen.arrow] : [])) {
      const image = createImage(arrow.src, 'stage-arrow', first);
      image.style.zIndex = frames.length + 1;
      positionWindow(image, arrow);
      stage.appendChild(image);
    }
    for (const copy of screen.notes || []) {
      const note = createNote(copy);
      if (copy.b) {
        const [x, y] = copy.b;
        const right = copy.anchor ? copy.anchor === 'r' : x >= 50;
        note.classList.toggle('anch-r', right);
        note.style.setProperty(right ? '--nr' : '--nx', 'calc(' + (right ? 100 - x : x) + '% - var(--note-anchor) / 2)');
        note.style.setProperty('--ny', 'calc(' + y + '% - var(--note-anchor) / 2)');
      } else {
        note.style.setProperty('--nx', percent(copy.x, 1400));
        note.style.setProperty('--ny', percent(copy.y, 1080));
      }
      stage.appendChild(note);
    }
    return stage;
  }

  function createContractDemo({ frames }) {
    const demo = document.createElement('div');
    demo.className = 'mobile-demo contract-demo';

    caseCopy.set(previous, { ru: '← Назад', en: '← Back' });

    const position = document.createElement('p');
    position.className = 'contract-position';
    position.setAttribute('aria-live', 'polite');
    nav.append(previous, position, next);

    const track = document.createElement('div');
    track.className = 'contract-steps';
    // В композиции для десктопа второй шаг рисуется поверх первого.
    const steps = [
      { frame: frames[1], caption: {
        ru: 'Договор нужен для доставки через ПВЗ, на склад и грузовых перевозок кузовами XL+ и фурами',
        en: 'The contract covers pickup-point and warehouse deliveries, and shipments by XL+ vehicles or heavy trucks',
      } },
      { frame: frames[0], caption: {
        ru: 'Клиент подтверждает ИНН через Диадок или Saby либо пополняет баланс',
        en: 'The customer verifies their tax ID through Diadoc or Saby, or by topping up the balance',
      } },
    ];
    const slides = steps.map(({ frame, caption }) => {
      const slide = document.createElement('figure');
      slide.className = 'contract-step';
      const text = document.createElement('figcaption');
      caseCopy.set(text, caption);
      slide.append(text, createDemoShot(frame));
      return slide;
    });
    track.append(...slides);
    demo.append(nav, track);

    let index = -1;
    function showStep(step) {
      if (index === step) return;
      index = step;
      previous.setAttribute('aria-disabled', String(index === 0));
      next.setAttribute('aria-disabled', String(index === slides.length - 1));
      slides.forEach((slide, i) => slide.setAttribute('aria-hidden', String(i !== index)));
      setDemoText(position, { ru: `Шаг ${index + 1} из ${slides.length}`, en: `Step ${index + 1} of ${slides.length}` });
    }
    function move(offset) {
      const step = index + offset;
      if (step >= 0 && step < slides.length) track.scrollTo({ left: step * track.clientWidth });
    }
    previous.addEventListener('click', () => move(-1));
    next.addEventListener('click', () => move(1));
    track.addEventListener('scroll', () => {
      if (!track.clientWidth) return;
      showStep(Math.max(0, Math.min(slides.length - 1, Math.round(track.scrollLeft / track.clientWidth))));
    }, { passive: true });
    showStep(0);
    return demo;
  }

      const row = document.createElement('div');
      row.className = 'scr-row';
      const cover = screen.cover || (screen.hold && Object.values(PROJECTS).flat().find(project => project.case === id)?.cover);
      if (cover) {
        row.classList.add('fit');
        const box = document.createElement('div');
        box.className = 'scr-cover';
        let art = box;
        if (screen.coverWidth) {
          section.classList.add('mac-screen');
          box.classList.add('mac-cover');
          box.style.setProperty('--cover-width', screen.coverWidth);
          box.style.setProperty('--cover-inset', screen.coverInset);
          art = document.createElement('div');
          art.className = 'mac-cover-art';
          box.appendChild(art);
        }
        art.appendChild(createImage(cover, '', first));
        if (screen.video) art.appendChild(createVideo(screen));
        row.appendChild(box);
      } else if (screen.video) {
        const box = document.createElement('div');
        box.className = 'scr-video';
        box.appendChild(createVideo(screen));
        row.appendChild(box);
      }

      if (screen.flip) {
        row.className = 'scr-win';
        row.appendChild(createFlip(screen));
      }
      if (screen.frames?.length) {
        row.className = 'scr-win diagram-row';
        row.appendChild(createWindows(screen, first));
        if (screen.mobileDemo) {
          row.classList.add('has-mobile-demo');
          row.appendChild(screen.mobileDemo(screen));
        }
      }
      if (screen.shots) {
        if (screen.phone) {
          row.classList.add('fit');
          row.style.setProperty('--span', screen.span);
        }
        row.appendChild(createPhones(screen, first));
      }

      section.appendChild(row);
      if (screen.notes?.length && !screen.frames && !screen.flip) addDesktopNotes(section, row, screen, goPair);
      feed.appendChild(section);
      slideObserver.observe(section);
    });
    videos.forEach((state, video) => videoObserver.observe(video));
  }

  function clampNotes() {
    if (mobile.matches) return;
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    for (const section of feed.children) {
      const box = section.getBoundingClientRect();
      for (const note of section.querySelectorAll('.note')) {
        if (!note.getClientRects().length) continue;
        note.style.removeProperty('--bshift');
        const body = note.querySelector('.note-body').getBoundingClientRect();
        const left = box.left + Math.max(40, 2.5 * rem);
        const right = box.right - 2.5 * rem;
        const shift = body.left < left ? left - body.left : Math.min(0, right - body.right);
        if (shift) note.style.setProperty('--bshift', Math.round(shift) + 'px');
      }
    }
  }

  function setBar() {
    if (!currentCase || mobile.matches) return;
    const max = feed.scrollHeight - feed.clientHeight;
    const progress = max > 0 ? Math.max(0, Math.min(1, feed.scrollTop / max)) : 0;
    caseBar.style.setProperty('--p', progress.toFixed(4));
  }

  let scrollFrame = 0;
  feed.addEventListener('scroll', () => {
    if (scrollFrame) return;
    scrollFrame = requestAnimationFrame(() => { scrollFrame = 0; setBar(); });
  }, { passive: true });

  function refreshLayout() {
    if (currentCase) {
      clampNotes();
      setBar();
    } else document.querySelectorAll('.fan').forEach(layoutFan);
  }

  let layoutFrame = 0;
  function requestLayout() {
    if (layoutFrame) return;
    layoutFrame = requestAnimationFrame(() => {
      layoutFrame = 0;
      refreshLayout();
    });
  }
  addEventListener('resize', requestLayout);
  document.fonts?.ready.then(requestLayout);
  document.fonts?.addEventListener('loadingdone', requestLayout);

  function translateCase() {
    const copy = CASES[currentCase][lang];
    const blocks = copy.blocks.map(([label, body]) => {
      const section = document.createElement('section');
      const title = document.createElement('h2');
      const paragraph = document.createElement('p');
      title.textContent = label;
      paragraph.textContent = body;
      section.append(title, paragraph);
      return section;
    });
    caseText.replaceChildren(...blocks);
    caseTitle.textContent = copy.title;
    for (const [element, strings] of caseCopy) element.textContent = strings[lang] || strings.ru;
    typograph(caseTitle);
    typograph(caseText);
    typograph(feed);
    document.title = copy.title + ' — ' + T[lang].name;
  }

  function renderCase(id) {
    if (id === currentCase || !Object.hasOwn(CASES, id)) return;
    setFolder(null);
    clearTimeout(catNap);
    cat.classList.remove('look');
    clearFeed();
    currentCase = id;
    document.body.dataset.view = 'case';
    setCollapsed(false);
    buildFeed(id);
    translateCase();
    feed.scrollTop = 0;
    scrollTo(0, 0);
    refreshLayout();
  }

  function showHome() {
    if (document.body.dataset.view === 'home') return;
    clearFeed();
    currentCase = null;
    document.body.dataset.view = 'home';
    document.title = T[lang].name + (lang === 'ru' ? ' — продуктовый дизайнер' : ' — product designer');
    scrollTo(0, 0);
    requestLayout();
  }

  function setHash(id) {
    const url = new URL(location.href);
    url.hash = id ? 'case/' + id : '';
    if (url.href === location.href) return;
    try { history.pushState(null, '', url); } catch {}
  }

  function openCase(id, keyboard = false) {
    if (id === currentCase || !Object.hasOwn(CASES, id)) return;
    renderCase(id);
    setHash(id);
    if (keyboard) caseTitle.focus({ preventScroll: true });
    Sound.play('expand');
  }

  function closeCase(e) {
    if (!currentCase) return;
    const folder = document.querySelector('[data-case="' + currentCase + '"]')?.closest('.folder');
    showHome();
    setHash(null);
    if (e?.detail === 0) (folder?.querySelector('.f-link') || document.querySelector('.f-link')).focus({ preventScroll: true });
    Sound.play('collapse');
  }

  function route() {
    const match = location.hash.match(/^#case\/(\w+)$/);
    if (match && Object.hasOwn(CASES, match[1])) renderCase(match[1]);
    else showHome();
    syncLangUrl();
  }

  addEventListener('popstate', route);
  addEventListener('hashchange', route);
  document.addEventListener('click', e => {
    const opener = e.target.closest('[data-case]');
    if (opener) openCase(opener.dataset.case, e.detail === 0);
  });
  document.getElementById('home-btn').onclick = closeCase;
  document.getElementById('back-fix').onclick = closeCase;

  function makeDraggable(el) {
    let suppressClick = false;
    el.addEventListener('click', e => {
      if (suppressClick && e.detail) {
        e.preventDefault();
        e.stopImmediatePropagation();
      }
      suppressClick = false;
    }, true);
    el.addEventListener('pointerdown', e => {
      suppressClick = false;
      if (mobile.matches || e.pointerType === 'touch' || e.button !== 0) return;
      const bounds = (el.offsetParent || document.body).getBoundingClientRect();
      const box = el.getBoundingClientRect();
      const dx = e.clientX - box.left, dy = e.clientY - box.top;
      let moved = false;
      el.setPointerCapture(e.pointerId);

      const move = event => {
        if (!moved && Math.hypot(event.clientX - e.clientX, event.clientY - e.clientY) < 4) return;
        moved = true;
        el.classList.add('dragging');
        const x = Math.max(8, Math.min(innerWidth - box.width - 8, event.clientX - dx)) - bounds.left;
        const y = Math.max(8, Math.min(innerHeight - box.height - 8, event.clientY - dy)) - bounds.top;
        el.style.left = Math.round(x) + 'px';
        el.style.top = Math.round(y) + 'px';
      };
      const finish = () => {
        el.removeEventListener('pointermove', move);
        for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) el.removeEventListener(event, finish);
        el.classList.remove('dragging');
        suppressClick = moved;
      };
      el.addEventListener('pointermove', move);
      for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(event, finish);
    });
  }

  document.querySelectorAll('.desk-item').forEach(makeDraggable);

  const snd = document.getElementById('snd');
  const syncSnd = () => snd.setAttribute('aria-pressed', String(Sound.on));
  syncSnd();
  snd.onclick = () => {
    Sound.on = !Sound.on;
    syncSnd();
    if (Sound.on) {
      Sound.unlock();
      Sound.play('tick');
    }
  };

  buildFans();
  translatePage();
  route();
</script>
</body>
</html>
