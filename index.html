<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Настя Балашова — продуктовый дизайнер</title>
<meta name="description" content="Продуктовый дизайнер с 3+ годами опыта. B2B-команда Яндекс Доставки.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/photo.jpg">
<style>
  /* Все размеры из макета 1440×1024 записаны в rem (1rem = 16px на 1440×1024)
     и масштабируются под окно. */
  :root {
    --glass: rgba(0, 0, 0, .5);
    --dim: rgba(255, 255, 255, .5);
    --font: "SF Pro Rounded", ui-rounded, "Nunito", system-ui, sans-serif;
    --ease: cubic-bezier(.3, .7, .2, 1);
  }
  html { font-size: clamp(11px, min(1.1111vw, 1.5625vh), 20px); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: #1b1b1d; color: #fff;
    font-family: var(--font); font-weight: 500;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  img { display: block; max-width: 100%; }

  .stage { position: relative; height: 100vh; height: 100svh; overflow: hidden; background: #e4e4e6; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 30%; }

  /* ── Иконки «рабочего стола» за карточкой ── */
  .desk { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .page-foot { display: none; }
  .desk-item {
    position: absolute; pointer-events: auto;
    display: flex; flex-direction: column; align-items: center; gap: .5rem;
    font-size: 1.25rem; text-shadow: 0 1px 8px rgba(0,0,0,.35);
    transition: transform .25s var(--ease);
  }
  .resume:hover { transform: translateY(-.25rem); }
  .resume { left: 20.625rem; top: 12.5rem; }
  .resume img { width: 5rem; }
  .cat { left: 9.625rem; top: 25.4rem; width: 11.5rem; gap: 0; }
  /* Кот из макета: по умолчанию отвернулся (Variant3), при наведении смотрит в камеру (Variant2) */
  .cat-pic { position: relative; width: 100%; aspect-ratio: 184 / 144; }
  /* Как в Figma: «смотрящий» кот ложится поверх картинки с пледом и закрывает отвернувшегося */
  .cat-pic img { position: absolute; left: 7.07%; }
  .cat-away { top: 14.96%; width: 84.7%; }
  .cat-look { top: 0; width: 90.49%; visibility: hidden; }
  .cat:hover .cat-look, .cat:focus-visible .cat-look, .cat.look .cat-look { visibility: visible; }

  /* ── Карточка ── */
  .card {
    position: absolute; left: 0; top: 0; bottom: 0; width: 32.5rem;
    background: var(--glass);
    -webkit-backdrop-filter: blur(48px) saturate(1.6); backdrop-filter: blur(48px) saturate(1.6);
    border-radius: 0 1.5rem 1.5rem 0; overflow: hidden;
    transition: width .5s var(--ease); z-index: 1;
  }
  .card-full, .card-mini { position: absolute; top: 0; bottom: 0; left: 0; transition: opacity .3s ease; }
  .card-full { width: 32.5rem; padding: 2.5rem; display: flex; flex-direction: column; }
  .card-mini { width: 7.5rem; opacity: 0; pointer-events: none; }
  .collapsed .card { width: 7.5rem; }
  .collapsed .card-full { opacity: 0; pointer-events: none; }
  .collapsed .card-mini { opacity: 1; pointer-events: auto; transition-delay: .15s; }

  .bio { font-size: 1.75rem; line-height: 1.2; color: var(--dim); }
  .bio p { margin: 0 0 1.25rem; }
  .bio b { font-weight: inherit; color: #fff; }
  .emo { display: inline-block; width: 1.1em; height: 1.1em; vertical-align: -.2em; margin-left: .1em; }
  .emo.big { width: 1.3em; height: 1.3em; vertical-align: -.3em; }
  .ext { white-space: nowrap; transition: color .2s; }
  .ext img { display: inline-block; width: 1em; vertical-align: -.12em; margin-left: .15em; opacity: .5; transition: opacity .2s; }
  .ext:hover { color: #fff; }
  .ext:hover img { opacity: 1; }

  .card-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: 1.25rem; }
  .toggle {
    width: 2.5rem; height: 2.5rem; border-radius: .5rem; display: grid; place-items: center;
    transition: background .2s;
  }
  .toggle:hover { background: rgba(255,255,255,.1); }
  .toggle img { width: 100%; }
  .toggle.back img { transform: scaleX(-1); }

  .mini-name {
    position: absolute; top: 2.5rem; left: 50%; transform: translateX(-50%) rotate(180deg);
    writing-mode: vertical-rl; font-size: 1.75rem; white-space: nowrap; /* читается снизу вверх */
  }
  .card-mini .toggle { position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%); }

  /* ── Кнопки справа сверху ── */
  .top { position: absolute; top: 2.5rem; right: 2.5rem; display: flex; gap: 1.25rem; z-index: 2; }
  .pill {
    /* padding-bottom поднимает текст на половину своей величины: строка центруется
       по буквам, а не по строчному боксу с запасом под выносные элементы */
    height: 2.5rem; padding: 0 1.25rem .22rem; border-radius: .5rem;
    display: inline-flex; align-items: center; gap: .5rem;
    background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(1.8); backdrop-filter: blur(28px) saturate(1.8);
    font-size: 1.25rem; transition: background .2s;
  }
  .pill:hover { background: rgba(0,0,0,.75); }
  .pill img { width: 1.5rem; }
  .lang { width: 3.75rem; padding: 0 0 .22rem; justify-content: center; }
  .snd { width: 3.75rem; padding: 0; justify-content: center; }   /* иконка — ровно по центру */
  .snd svg { width: 1.5rem; height: 1.5rem; }
  .snd .snd-off, .snd[aria-pressed="false"] .snd-on { display: none; }
  .snd[aria-pressed="false"] .snd-off { display: block; }

  /* ── Папки ── */
  .folders { position: absolute; right: 2.5rem; bottom: 6.5rem; display: flex; gap: 2.5rem; }  /* +2rem: подпись теперь вне потока */
  .folder { position: relative; width: 12.75rem; }
  .f-link { position: relative; display: flex; flex-direction: column; align-items: center; gap: .5rem; font-size: 1.25rem; white-space: nowrap; }
  /* подпись висит под папкой и не влияет на высоту ряда: вторая строка не двигает папки */
  .f-link > span { position: absolute; top: calc(100% + .5rem); left: -1rem; right: -1rem; text-align: center; }
  .f-body {
    position: relative; width: 80%; aspect-ratio: 204 / 140; border-radius: 10% / 14.57%;
    container-type: inline-size; --p: calc(100cqw / 204);
    -webkit-backdrop-filter: blur(28px) saturate(1.8); backdrop-filter: blur(28px) saturate(1.8);
    transition: transform .35s var(--ease);
  }
  .folder:hover .f-body { transform: translateY(-.4rem) rotate(-1.5deg); }
  .f-body > * { position: absolute; }
  .f-front { left: 0; bottom: 0; width: 100%; height: 76.36%; transition: transform .35s var(--ease); transform-origin: bottom; }
  .folder:hover .f-front { transform: perspective(40rem) rotateX(-14deg); }
  .f-icons { inset: 0; transition: transform .35s var(--ease); transform-origin: bottom; }
  .folder:hover .f-icons { transform: perspective(40rem) rotateX(-14deg); }
  .f-icons > * { position: absolute; }
  .red   { background: rgba(160, 69, 52, .2); }
  .green { background: rgba(82, 120, 0, .4); }
  .ya    { left: 2.5%; top: 30%; width: 27.45%; }
  /* Коробка собрана слоями ровно как в Figma: белая подложка (обводка) + красная коробка из двух кусков + эмблема.
     --p — один пиксель макета папки (папка 204px в Figma). */
  .box { left: calc(50 * var(--p)); top: calc(80 * var(--p)); width: calc(50.276 * var(--p)); aspect-ratio: 1; }
  .box-layer { position: absolute; display: grid; place-items: center; }
  .box-out { left: 0; top: 0; width: calc(50.276 * var(--p)); height: calc(50.276 * var(--p)); }
  .box-in { left: calc(3.37 * var(--p)); top: calc(3.37 * var(--p)); width: calc(43.529 * var(--p)); height: calc(43.529 * var(--p)); }
  .icon-box { position: relative; overflow: hidden; transform: rotate(171.28deg) scaleY(-1); }
  .box-out .icon-box { width: calc(44.1 * var(--p)); height: calc(44.1 * var(--p)); }
  .box-in .icon-box { width: calc(38.182 * var(--p)); height: calc(38.182 * var(--p)); }
  .icon-box > * { position: absolute; max-width: none; }
  /* белая обводка — силуэт той же коробки, на 15% больше и по тому же центру */
  .box-out .icon-box { filter: brightness(0) invert(1); }
  .s1, .s2 { overflow: hidden; top: 8.2%; height: 83.9%; }
  .s1 { left: 4.77%; width: 68.64%; }
  .s2 { left: 68.83%; width: 22.88%; }
  .s1 img, .s2 img { position: absolute; top: 0; height: 100%; max-width: none; }
  .s1 img { left: -0.2%; width: 133.73%; }
  .s2 img { left: -300.6%; width: 401.2%; }
  .u { left: 39.12%; width: 40.5%; top: calc(50% + 1.16 * var(--p)); transform: translateY(-50%); aspect-ratio: 30.86 / 35.77; }
  .otp   { left: 8.56%; top: 36.1%; width: 19.2%; transform: rotate(5.85deg); }
  .frog  { left: 65.5%; top: 64.9%; width: 24.25%; transform: rotate(-24.25deg); }
  .cu    { inset: 0; width: 100%; height: 100%; }

  /* ── Обложки проектов: стеклянные карточки встают над папкой в шахматном порядке ── */
  .fan { position: absolute; left: 50%; bottom: 100%; width: 0; height: 0; pointer-events: none;
         font-size: calc(var(--k, 1) * 1rem); }
  .fan-item {
    position: absolute; left: 0; bottom: 0; width: 10.2em;   /* ширина как у папки: 80% от 12,75rem */
    display: flex; flex-direction: column; align-items: center; text-align: center;
    opacity: 0; transform: translate(-50%, 0) scale(.35);
    transition: transform .46s cubic-bezier(.2, 1.18, .32, 1), opacity .22s ease;
    transition-delay: calc(var(--i) * 45ms);
  }
  .fan-cover {
    position: relative; width: 100%; aspect-ratio: 204 / 140; overflow: hidden;
    display: grid; place-items: center; border-radius: .8em;
    background: rgba(255, 255, 255, .14);
    -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6);
    box-shadow: 0 .5em 1.4em rgba(0, 0, 0, .28);
    transition: transform .25s var(--ease);
  }
  .fan-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .fan-emoji { font-size: 4em; line-height: 1; filter: drop-shadow(0 .1em .2em rgba(0,0,0,.45)); }
  .fan-name {
    max-width: 100%; margin-top: .5rem; /* 8px до подписи */ font-size: 1.25rem; text-align: center;
    line-height: 1.2; min-height: 2.4em;        /* подписи в две строки — у всех карточек одна высота */
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    text-shadow: 0 1px 8px rgba(0,0,0,.5);
  }
  .folder:hover .fan, .folder:focus-within .fan, .folder.open .fan { pointer-events: auto; }
  /* невидимый мостик, чтобы веер не закрывался, пока курсор идёт к карточкам */
  .folder:hover .fan::before, .folder:focus-within .fan::before, .folder.open .fan::before {
    content: ""; position: absolute; left: var(--bl, -12rem); width: var(--bw, 24rem);
    bottom: -1rem; height: var(--h, 0px);
  }
  .folder:hover .fan-item, .folder:focus-within .fan-item, .folder.open .fan-item {
    opacity: 1;
    transform: translate(calc(-50% + var(--x)), calc(-1 * var(--y))) rotate(var(--a));
  }
  .fan-item:hover .fan-cover { transform: translateY(-.35em) scale(1.06); }

  /* ── Заголовок кейса и кнопки внутри карточки (макет 85:19987) ── */
  .case-title { display: none; margin: 0 0 2.5rem; font-size: 1.75rem; line-height: 1.19; font-weight: 600; }
  body[data-view="case"] .case-title { display: block; }   /* название кейса — вверху панели */

  /* ── Лента экранов кейса: прокрутка справа со своим индикатором ── */
  .case-feed {
    display: none; position: absolute; left: 32.5rem; top: 0; right: 0; bottom: 0;
    overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none;   /* экран всегда дотягивается целиком */
  }
  .case-feed::-webkit-scrollbar { display: none; }
  body.has-feed .case-feed { display: block; }
  body.has-feed .case-phone, body.has-feed .case-laptop { display: none; }   /* устройство живёт в ленте */
  .case-screen { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; }
  /* экраны стоят по центру белой области — того, что осталось правее карточки */
  .scr-row { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* пара телефонов: 431,33×885,33 каждый, ровно 40px между ними */
  /* если вся композиция помещается в кадр 1400, он и занимает всю белую область */
  .scr-row.fit { --u: min(1px, (100cqw - 32.5rem) / var(--span, 1400), 100cqh / 1080); --n: var(--u); }
  .scr-pair { position: relative; display: flex; gap: calc(40 * var(--u)); height: calc(var(--ph-h, 885.333) * var(--u)); }
  .scr-item { position: relative; height: 100%; aspect-ratio: var(--ph-ar, 431.333 / 885.333); }
  /* снимок шире самого прибора (тень по бокам) — кладём его с выносом, чтобы корпус встал ровно */
  .scr-item.bleed { overflow: visible; }
  .scr-item.bleed img { position: absolute; top: var(--sy, 0); left: var(--sx, 0);
                        width: var(--sw, 100%); height: auto; }
  /* широкий экран: один-два кадра интерфейса и выноска слева — для десктопных кейсов */
  .scr-wide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .wide-stage { position: relative; width: calc(1400 * var(--u)); max-width: 100%; height: 100%; display: flex; align-items: center; }
  .wide-shots {
    margin: 0 calc(40 * var(--u)) 0 calc(460 * var(--u)); flex: 1; min-width: 0;
    height: calc(880 * var(--u)); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: calc(32 * var(--u));
  }
  .wide-shots img {
    max-width: 100%; min-height: 0; object-fit: contain; border-radius: calc(12 * var(--u));
    max-height: calc((100% - (var(--shots) - 1) * 32 * var(--u)) / var(--shots));
  }
  .scr-wide .note { left: calc(40 * var(--u)); top: 50%; transform: translateY(-50%); right: auto; bottom: auto; }
  /* окна с текстом исследования — координаты из макета 1400×1080 */
  .scr-win { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             /* здесь кадр 1400 — это и есть белая область, без вылетов выносок за край */
             --u: min(1px, (100cqw - 32.5rem) / 1400, 100cqh / 1080); --n: var(--u);
             /* поле между кадром и правым краем экрана — кадр стоит по центру белой области */
             --edge: calc((100cqw - 32.5rem - 1400 * var(--u)) / 2); }
  /* выноска выравнивается правым краем по кнопке звука: 2,5rem до края + 3,75rem «ру» + 1,25rem зазор */
  .note.at-snd { right: calc(7.5rem - var(--edge)); left: auto; }
  .win-stage { position: relative; width: calc(1400 * var(--u)); height: calc(1080 * var(--u)); max-width: 100%; }
  .win {
    position: absolute; width: calc(600 * var(--u)); border-radius: calc(16 * var(--u)); overflow: hidden;
    background: #d5d5d5; color: #1d1d1d;
  }
  .win-bar { display: flex; align-items: center; gap: calc(16 * var(--u)); background: #6a6a6a; color: #fff;
             height: calc(60 * var(--u)); padding: 0 calc(16 * var(--u)); font-size: calc(16 * var(--u)); }
  .win-dots { display: flex; gap: calc(12 * var(--u)); }
  .win-dots i { width: calc(24 * var(--u)); height: calc(24 * var(--u)); border-radius: 50%; }
  .win-dots i:nth-child(1) { background: #a5594c; }
  .win-dots i:nth-child(2) { background: #a69255; }
  .win-dots i:nth-child(3) { background: #92a56a; }
  .win-body { padding: calc(4 * var(--u)) calc(16 * var(--u)) calc(4 * var(--u));
              font-size: calc(16 * var(--u)); line-height: calc(19 * var(--u)); }
  .win-body p { margin: 0; padding: calc(12 * var(--u)) 0; }
  .win-body p + p { border-top: 1px solid #bfbfbf; }
  /* окно браузера с кадром интерфейса: радиус 24, шапка 60 — ровно как в макете */
  .win-img { background: #fff; border: 1px solid #c9c9c9; border-radius: calc(24 * var(--u));
             display: flex; flex-direction: column; }
  .win-img .win-bar { background: rgba(0, 0, 0, .6); flex: 0 0 calc(60 * var(--u));
                      padding: 0 calc(19 * var(--u)); gap: calc(12 * var(--u)); }
  .win-img .win-dots i:nth-child(1) { background: #a25649; }
  .win-img .win-dots i:nth-child(2) { background: #a48e52; }
  .win-img .win-dots i:nth-child(3) { background: #90a266; }
  .win-shot { flex: 1; min-height: 0; width: 100%; display: block;
              object-fit: cover; object-position: top; }
  .stage-arrow { position: absolute; display: block; }
  /* выноски к окнам стоят по координатам макета 1400×1080, ширина — как в кейсе роботов */
  .note-bar { display: contents; }                   /* на компьютере обёртка ничего не меняет */
  .win-stage .note { position: absolute; width: calc(380 * var(--u)); transform: none; z-index: 20; }
  /* ноутбук в ленте — та же рамка, что на главном экране кейса */
  .scr-laptop { position: relative; width: calc(1280 * var(--u)); aspect-ratio: 1280 / 776; }
  .scr-item img { width: 100%; height: 100%; display: block; }
  .scr-phone { width: 26%; min-width: 16rem; max-height: 72%; }
  /* первый экран: видео стоит само по себе — телефон уже внутри ролика.
     Радиус 120px от ширины 816 и высоты 1684 обрезает чёрные углы кадра */
  .scr-video {
    height: calc(885.333 * var(--u)); aspect-ratio: 816 / 1684;
    border-radius: 14.7% / 7.13%; overflow: hidden; background: #000;
  }
  .scr-video video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scr-phone { position: relative; aspect-ratio: 431.33 / 885.33; }
  .scr-phone .ph-body { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scr-phone .ph-scr {
    position: absolute; left: 4.4%; right: 4.48%; top: 1.88%; bottom: 1.88%;
    border-radius: 7%; overflow: hidden; background: #000;
  }
  .scr-phone video { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* выноски: ровно 260px, текст 16/17 — как в макете. Координаты заданы долей
     от телефона, к которому выноска привязана, поэтому она ложится на тот же элемент */
  .note {
    position: absolute; z-index: 2;                 /* выноски всегда поверх телефонов */
    width: calc(var(--nw, 380) * var(--n));
    padding: calc(16 * var(--n)); border-radius: calc(16 * var(--n));
    background: var(--glass);                       /* 60%, как у остального стекла */
    -webkit-backdrop-filter: blur(32px) saturate(1.9); backdrop-filter: blur(32px) saturate(1.9);
    color: #fff;                                    /* SF Pro Rounded Medium 16/120% */
    font-size: calc(16 * var(--n)); line-height: 1.2;
    left: var(--nx); right: var(--nr); top: var(--ny); bottom: var(--nb);
  }
  .note-tap { display: none; }
  .scr-title { display: none; }                     /* пары подписаны только на телефоне */

  .case-bar {
    display: none; position: absolute;              /* 12×40 в 28px от края — как в макете */
    right: 2.5rem;                                  /* правым краем под кнопкой языка */
    width: calc(12 * var(--u)); height: calc(40 * var(--u));
    /* верхняя точка — ниже кнопок, чтобы сразу было видно, что экран прокручивается */
    top: calc(6.25rem + var(--p, 0) * (100% - 6.25rem - 80 * var(--u)));
    border-radius: calc(8 * var(--u)); background: var(--glass); transition: top .12s linear;
    -webkit-backdrop-filter: blur(32px) saturate(1.9); backdrop-filter: blur(32px) saturate(1.9);
  }
  body.has-feed .case-bar { display: block; }

  /* ── Экран кейса (по макету 1440×1024) ── */
  .case {
    position: absolute; inset: 0; background: #fff; display: none; overflow: hidden;
    /* 1u — один пиксель макета: кадр 1400×1080 вписывается в свободное место справа */
    container-type: size;
    /* по ширине кадр считается от композиции: пара 902,67 + два вылета выносок,
       плюс поля, в которых помещается индикатор под кнопкой языка */
    --u: min(1px, (100cqw - 32.5rem - 5rem + 64px) / 1686.67, 100cqh / 1080);
    --n: var(--u);                                  /* выноски в том же масштабе, что телефоны */
  }
  body[data-view="case"] .case { display: block; animation: screen-in .24s var(--ease) both; }
  /* мягкая смена экранов: только прозрачность и сдвиг — без пересчёта раскладки */
  @keyframes screen-in { from { opacity: 0; transform: translateY(.5rem); } to { opacity: 1; transform: none; } }
  body[data-view="case"] .case-text { animation: screen-in .26s var(--ease) .03s both; }
  body[data-view="home"] .stage { animation: screen-in .24s var(--ease) both; }
  body[data-view="case"] .stage, body[data-view="case"] .desk { display: none; }
  body[data-view="case"] .bio,
  body[data-view="case"] .mini-name:not(.mini-case) { display: none; }
  body[data-view="case"] .mini-case { display: inline-flex; }
  body[data-view="case"] .case-text { display: flex; }
  .case-text, .case-foot, .mini-case, .home-btn { display: none; }

  /* текст кейса: блоки через 20px, внутри блока 4px, всё 20px */
  .case-text { flex-direction: column; gap: 1.25rem; width: 27.5rem; font-size: 1.25rem; line-height: 1.19;
               overflow-y: auto; scrollbar-width: thin; }
  .case-text section { display: flex; flex-direction: column; gap: .25rem; }
  .case-text h2 { margin: 0; font-size: inherit; font-weight: inherit; color: var(--dim); }
  .case-text p { margin: 0; }

  /* Макбук. В макете (1440×1024) он шириной 1280, стоит на 480 и обрезается правым краем.
     На широком окне он не может расти: иначе не влезает по высоте и обрежется сам экран.
     Поэтому размер держим по высоте, а сам макбук ставим по центру свободного места
     справа от карточки, но не левее, чем в макете.
     Нижний край держим на одной линии с подписью кейса внизу карточки — 48px от низа. */
  .no-screen .case-laptop { display: none; }
  .case-laptop {
    --lw: min(88.9vw, 125vh);
    position: absolute; bottom: 3rem; width: var(--lw); aspect-ratio: 1280 / 776;
    left: max(30rem, calc((100vw + 32.5rem - var(--lw)) / 2));
    overflow: hidden;
  }
  /* при сворачивании панели ноутбук остаётся на месте: уезжает только панель */
  /* в макете картинка макбука сдвинута на -25px при ширине 1280 — это -1.953% */
  /* Телефон для мобильных кейсов: высота 82% экрана, низ на одной линии с подписью,
     по центру свободного места справа от карточки — как и ноутбук */
  .case-phone {
    --pw: min(39.94vh, 28vw);
    position: absolute; bottom: 3rem; width: var(--pw); aspect-ratio: 431.33 / 885.33;
    left: max(30rem, calc((100vw + 32.5rem - var(--pw)) / 2));
  }
  .ph-body { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .case-phone .mb-screen { inset: 1.88% 4.48%; left: 4.4%; right: 4.48%; top: 1.88%; bottom: 1.88%;
    width: auto; height: auto; border-radius: 7%; }
  body:not(.phone-case) .case-phone, body.phone-case .case-laptop { display: none; }
  .no-screen .case-phone { display: none; }

  .mb-body { position: absolute; left: -1.953%; top: 0; width: 99.967%; height: 100%; object-fit: cover; }
  .mb-screen { position: absolute; left: 8.2%; top: 3.35%; width: 79.8%; height: 85.56%; overflow: hidden; background: #0d0d0f; }
  .mb-screen > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mb-empty { display: grid; place-items: center; padding: 2rem; text-align: center; color: rgba(255,255,255,.5); font-size: 1.25rem; }
  .mb-screen.has-video video, .mb-screen.has-shot .mb-shot { display: block; }
  .mb-screen video, .mb-shot { display: none; }
  .mb-screen.has-video .mb-empty, .mb-screen.has-shot .mb-empty { display: none; }

  /* файлы на «рабочем столе» кейса */
  .case-file {
    position: absolute; width: 7rem; display: flex; flex-direction: column; align-items: center; gap: .5rem;
    font-size: 1.25rem; color: #000; text-align: center;
    transition: transform .2s var(--ease);
  }
  .case-file:hover { transform: translateY(-.25rem); }
  /* Safari иначе перехватывает жест и тащит копию картинки вместо иконки */
  .case-file, .desk-item { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .case-file img, .desk-item img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
  .case-file.dragging, .desk-item.dragging { cursor: grabbing; transition: none; }
  .case-file img { width: 5rem; }

  .home-btn { display: none; }

  /* ── Окна с текстом (фрейм 42:20994): 520×496, стекло, шапка 60 светлее,
     заголовок чёрный слева на 40/18, крестик 16 справа на 40/22, текст белый 20 ── */
  .docs { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .doc-window {
    position: absolute; pointer-events: auto;
    width: min(92vw, 32.5rem); height: min(80vh, 31rem);
    display: flex; flex-direction: column;
    background: rgba(255,255,255,.2); border-radius: .85rem; overflow: hidden;
    -webkit-backdrop-filter: blur(48px) saturate(1.6); backdrop-filter: blur(48px) saturate(1.6);
  }
  .doc-bar {
    position: relative; flex: none; height: 3.75rem; background: rgba(255,255,255,.4);
    cursor: grab; user-select: none; touch-action: none;
  }
  .doc-bar:active { cursor: grabbing; }
  .doc-title {
    position: absolute; left: 2.5rem; top: 1.125rem; width: 27.5rem;
    font-size: 1.25rem; line-height: 1.19; color: #000;
  }
  .doc-close {
    position: absolute; right: 1.75rem; top: .625rem; width: 2.5rem; height: 2.5rem;
    display: grid; place-items: center; transition: opacity .2s;
  }
  .doc-close:hover { opacity: .6; }
  .doc-close img { width: 1rem; }   /* иконка 16px как в макете, кликабельная зона 40 */
  .doc-body {
    overflow: auto; padding: 2.5rem; font-size: 1.25rem; line-height: 1.19; color: #fff;
    scrollbar-width: thin;
  }
  /* на светлом экране кейса белый текст на стекле не читается — там он чёрный */
  body[data-view="case"] .doc-body { color: #000; }
  .doc-body h3 { margin: 1.25rem 0 .25rem; font-size: inherit; font-weight: inherit; }
  .doc-body h3:first-child { margin-top: 0; }
  .doc-body p { margin: 0 0 1.25rem; white-space: pre-line; }
  .doc-body p:last-child { margin-bottom: 0; }
  .doc-body a { text-decoration: underline; }

  a:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: .5rem; }

  /* ── Телефоны и узкие окна ── */
  @media (max-width: 760px), (max-aspect-ratio: 4/5) {
    html { font-size: 16px; }
    .stage { height: 78svh; min-height: 30rem; }
    .bg { object-position: 68% 25%; }
    .top { top: 1rem; right: 1rem; gap: .5rem; }
    .pill { height: 2.25rem; padding: 0 .875rem .18rem; font-size: 1rem; }
    .pill img { width: 1.25rem; }
    .lang { width: 2.75rem; padding: 0 0 .18rem; }
    .snd { width: 2.75rem; padding: 0; }
    .folders { left: 1rem; right: 1rem; bottom: 2.5rem; gap: .75rem; justify-content: space-between; }
    .folder { flex: 1; width: auto; min-width: 0; }
    .f-link { font-size: 1rem; white-space: normal; text-align: center; line-height: 1.2; }
    .f-link > span { position: static; left: auto; right: auto; }   /* на телефоне подпись в потоке */
    .fan-item { width: 8.5rem; }           /* пучок по тапу: карточки компактнее */
    .fan-name { font-size: 1rem; }

    /* Кейс на узком экране: ноутбук сверху, под ним текст, ниже файлы */
    body[data-view="case"] .case { position: static; display: flex; flex-direction: column; padding: 4.5rem 1rem 0; }
    .case-laptop { position: relative; inset: auto; width: 100%; aspect-ratio: 1280 / 776; margin: 0 0 1.5rem; }
    .case-phone { position: relative; inset: auto; width: min(60vw, 15rem); margin: 0 auto 1.5rem; }
    .case-text { width: auto; font-size: 1.125rem; }
    /* на телефоне заголовок остаётся в чёрном блоке, как сейчас */
    .case-title { font-size: 1.5rem; margin-bottom: 1.5rem; }
    body[data-view="case"] .top { top: 1rem; bottom: auto; left: auto; right: 1rem; }
    body[data-view="case"] .home-btn { display: inline-flex; }   /* шеврона на узком экране нет */
    /* на телефоне порядок такой: видео, описание проекта, потом экраны с выносками */
    body[data-view="case"] { background: #fff; }
    body[data-view="case"] .case, body.has-feed .case-feed { display: contents; }
    .case-screen { height: auto; margin-bottom: 40px; padding: 0 1rem; order: 0;
                   container-type: inline-size; }
    .scr-title { display: block; margin: 0 1.25rem 1.25rem; font-size: 1.5rem; line-height: 1.19;
                 font-weight: 600; color: #1b1b1d; }
    .case-screen:first-child { order: -2; padding-top: 4.5rem; margin-bottom: 40px; }
    /* пустой экран под будущий ролик на телефоне не показываем */
    .case-screen.is-hold { display: none; }
    /* кейс начинается с пустого экрана — значит первой на телефоне идёт чёрная карточка */
    body:has(.case-screen.is-hold) .card { margin-top: 0; padding-top: 5.25rem; }
    body[data-view="case"] .card { order: -1; }
    .case-laptop, .case-phone { order: -2; }
    .case-desk { order: 1; }
    .page-foot { order: 2; }
    /* телефон целиком влезает в экран по высоте */
    .scr-row, .scr-pair { position: static; display: block; height: auto; }
    .scr-item, .scr-video { position: relative; height: auto; max-height: none; margin: 0 auto 40px; }
    .scr-item { width: min(100%, (100svh - 5rem) / 2.0525); }
    .scr-video { width: min(100%, (100svh - 5rem) / 2.0637); }
    .scr-item img { height: auto; }
    .scr-item.bleed img { position: static; width: 100%; }   /* на телефоне запас вокруг корпуса не нужен */
    .scr-item:last-child, .scr-video { margin-bottom: 0; }
    .scr-wide, .wide-stage { position: static; display: block; height: auto; width: auto; max-width: none; }
    /* окна на телефоне идут столбиком во всю ширину, выноски — рядом «жми» под ними */
    .scr-win { position: static; display: block; height: auto; }
    .win-stage { position: static; width: auto; height: auto; max-width: none;
                 display: flex; flex-direction: column; gap: 1.25rem; }
    /* координаты из макета тут не нужны: окна идут одно под другим во всю ширину */
    .win { position: static; border-radius: 1rem;
           left: auto !important; top: auto !important;
           width: auto !important; height: auto !important; }
    .win-bar { height: 2.75rem; gap: .5rem; padding: 0 .75rem; font-size: 1rem; }
    .win-dots { gap: .5rem; }
    .win-dots i { width: .875rem; height: .875rem; }
    .win-body { padding: 0 .75rem; font-size: 1rem; line-height: 1.25; }
    .win-body p { padding: .75rem 0; }
    .win-img { border-radius: 1rem; }
    .win-img .win-bar { flex: 0 0 2.75rem; padding: 0 .75rem; gap: .5rem; }
    .win-shot { height: auto; object-fit: contain; }
    .stage-arrow { display: none; }                  /* стрелка между окнами тут не нужна */
    .note-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
    .note-bar .note { position: static; transform: none; width: 100%; }
    .note-bar .note:not(.open) { flex: 0 0 auto; }
    .wide-shots { margin: 0; height: auto; gap: 1rem; }
    .wide-shots img { max-height: none; width: 100%; }
    .scr-wide .note { position: static; transform: none; width: auto; margin-top: 1rem; }
    /* выноска свёрнута в «жми» и раскрывается по тапу — обе по центру телефона */
    .note {
      top: var(--py); bottom: auto; left: 50%; right: auto; transform: translateX(-50%);
      width: 83.46%; padding: 23px 16px 16px; border-radius: 20px;
      font-size: 16px; line-height: 1.2; cursor: pointer;
    }
    /* на телефоне шип всегда сверху по центру — угловые отступы десктопа тут не нужны */
    .note.tl, .note.tr, .note.bl, .note.br { padding: 23px 16px 16px; }
    .note:not(.open) {
      width: 68px; height: 55px; padding: 7px 0 0; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .note:not(.open) .note-text { display: none; }
    .note:not(.open) .note-tap { display: inline; }
    .case-bar { display: none !important; }
    .case-desk { order: 3; position: static; display: flex; flex-wrap: wrap; gap: 1.5rem; padding: 1.5rem 1rem 2rem; background: #fff; }
    .case-desk:empty { display: none; }               /* пустой стол больше не тянет белую полосу под футер */
    .case-file { position: static !important; flex: 0 0 auto; width: 7.5rem; font-size: 1rem; }
    .case-file img { width: 3.5rem; }
    body[data-view="case"] .card { background: #1b1b1d; }
    .card, .collapsed .card {
      position: relative; width: auto; min-height: 0;
      margin-top: -1.5rem; border-radius: 1.5rem 1.5rem 0 0;
      background: #1b1b1d;
    }
    /* в кейсе чёрный блок — отдельная карточка с отступом 40px до телефонов */
    body[data-view="case"] .card { margin: 0 1rem 40px; border-radius: 1.5rem; }
    .card-full { position: static; width: auto; padding: 40px 1.25rem; }
    .card-mini, .toggle { display: none; }
    .collapsed .card-full { opacity: 1; pointer-events: auto; }
    .bio { font-size: 1.375rem; }

    /* на телефоне «2026, всё своими лапками» уезжает в самый низ экрана */
    body { display: flex; flex-direction: column; min-height: 100svh; }
    .stage, .card, .desk, .page-foot { flex: none; }
    .desk { position: static; display: flex; gap: 1.5rem; align-items: flex-end; padding: 0 1.25rem 1.5rem; background: #1b1b1d; }
    .page-foot {
      display: block; margin-top: auto; background: #1b1b1d; color: var(--dim);
      font-size: 1rem; padding: 0 1.25rem 1.5rem;
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
    }
    /* в кейсе футер — такая же карточка: 40px сверху, скруглённый верх, ниже ничего нет */
    body[data-view="case"] .page-foot {
      margin: 40px 1rem 0; border-radius: 1.5rem 1.5rem 0 0; padding-top: 1.5rem;
    }
    .case-screen:last-of-type { margin-bottom: 0; }   /* отступ до футера задаёт сам футер */
    .card-foot { display: none; }
    .desk-item { position: static; font-size: 1rem; }
    .resume img { width: 3.5rem; }
    .cat { width: 7rem; }
  }

  /* низкое окно: шесть блоков кейса должны помещаться без прокрутки */
  @media (min-width: 761px) and (max-height: 760px) {
    .card-full { padding: 1.75rem 2.5rem; }
    .case-text { gap: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>

    }

    // три папки звучат нотами одного аккорда (до мажор)
    const NOTES = [523.25, 659.25, 783.99];

    const sfx = {
      tick()       { tone(2200, { dur: .025, gain: .04 }); },
      folderHover(i) {
        const f = NOTES[i] || NOTES[0];
        tone(f, { dur: .22, gain: .12 }); tone(f * 2, { type: 'triangle', dur: .12, gain: .03 });
      },
      folderOpen(i) {
        const f = NOTES[i] || NOTES[0];
        tone(f, { dur: .12, gain: .12 }); tone(f * 1.5, { dur: .25, gain: .1, delay: .07 });
      },
      collapse() {
        noise({ dur: .35, gain: .12, from: 2400, to: 300, q: 1.2 });
        tone(200, { dur: .18, gain: .12, to: 110, delay: .22 });
      },
      expand() {
        noise({ dur: .35, gain: .12, from: 300, to: 2400, q: 1.2 });
        tone(330, { dur: .12, gain: .08, to: 520, delay: .2 });
      },
      lang(up) {
        const [a, b] = up ? [660, 990] : [990, 660];
        tone(a, { dur: .07, gain: .08 }); tone(b, { dur: .1, gain: .08, delay: .07 });
      },
      paper() {
        noise({ dur: .07, gain: .07, type: 'highpass', from: 3000, q: .7 });
        noise({ dur: .09, gain: .05, type: 'highpass', from: 4000, q: .7, delay: .08 });
      },
      meow() {
        // «мяу»: пила через формантные фильтры, высота растёт и спадает
        const t = ctx.currentTime, dur = .6;
        const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(420, t);
        o.frequency.linearRampToValueAtTime(760, t + .14);
        o.frequency.linearRampToValueAtTime(700, t + .3);
        o.frequency.exponentialRampToValueAtTime(430, t + dur);
        const vib = ctx.createOscillator(), vg = ctx.createGain();
        vib.frequency.value = 6; vg.gain.value = 12; vib.connect(vg).connect(o.frequency);
        lp.type = 'lowpass'; lp.Q.value = 4;
        lp.frequency.setValueAtTime(500, t);
        lp.frequency.linearRampToValueAtTime(3200, t + .12);
        lp.frequency.exponentialRampToValueAtTime(900, t + dur);
        const f1 = ctx.createBiquadFilter(), f2 = ctx.createBiquadFilter();
        f1.type = f2.type = 'bandpass'; f1.Q.value = 6; f2.Q.value = 8;
        f1.frequency.setValueAtTime(800, t); f1.frequency.linearRampToValueAtTime(1100, t + .15); f1.frequency.linearRampToValueAtTime(750, t + dur);
        f2.frequency.setValueAtTime(1900, t); f2.frequency.linearRampToValueAtTime(2500, t + .15); f2.frequency.linearRampToValueAtTime(1800, t + dur);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(.28, t + .06);
        g.gain.setValueAtTime(.28, t + .35);
        g.gain.exponentialRampToValueAtTime(.0001, t + dur);
        o.connect(lp); lp.connect(f1).connect(g); lp.connect(f2).connect(g); g.connect(out);
        o.start(t); vib.start(t); o.stop(t + dur + .05); vib.stop(t + dur + .05);
      },
    };

    return {
      play(name, arg, gap = 60) {
        if (!on || !ctx || !sfx[name]) return;
        const key = name + (arg ?? '');
        // контекст засыпает, когда вкладка уходит в фон или страница живёт во фрейме:
        // будим его и доигрываем звук, а не молчим
        if (ctx.state !== 'running') {
          ctx.resume().then(() => { if (on && ctx.state === 'running' && throttle(key, gap)) { heard = true; sfx[name](arg); } }, () => {});
          return;
        }
        if (throttle(key, gap)) { heard = true; sfx[name](arg); }
      },
      get on() { return on; },
      set on(v) { on = v; store.set('sound', v ? 'on' : 'off'); },
      // был ли хоть один реально сыгранный звук
      get heard() { return heard; },
      unlock,
    };
  })();

  let lang = store.get('lang') || (navigator.language.startsWith('ru') ? 'ru' : 'en');
  setLang(lang);
  document.getElementById('lang').onclick = () => {

  // ── Веер проектов: раскладываем карточки по дуге над папкой ──
  function buildFans() {
    document.querySelectorAll('.folder').forEach(folder => {
      const key = folder.querySelector('[data-link]').dataset.link, items = PROJECTS[key] || [];

        fan.appendChild(a);
      });
      // слушатели вешаем один раз: buildFans вызывается ещё и при смене языка
      if (!folder.dataset.bound) {
        folder.dataset.bound = '1';
        // каждый раз карточки вылетают чуть вразнобой: задержка и скорость свои
        folder.addEventListener('pointerenter', () => {
          folder.querySelectorAll('.fan-item').forEach((a, i) => {
            a.style.transitionDelay = Math.round(i * 36 + Math.random() * 90) + 'ms';
            a.style.transitionDuration = (.42 + Math.random() * .16).toFixed(2) + 's, .22s';
          });
        });
        folder.addEventListener('pointerleave', () => {
          folder.querySelectorAll('.fan-item').forEach(a => { a.style.transitionDelay = '0ms'; });
        });
        // там, где нет курсора, пучок открывается по тапу по папке
        folder.addEventListener('click', e => {
          if (matchMedia('(hover: hover)').matches || e.target.closest('.fan-item')) return;
          e.preventDefault();
          const open = folder.classList.contains('open');
          closeFans();
          const current = folder.querySelector('.fan');
          if (!open && current) { layoutFan(current); folder.classList.add('open'); }
        });
      }
      folder.appendChild(fan);
      typograph(fan);
      layoutFan(fan);
    });
  }

  function closeFans() {
    document.querySelectorAll('.folder.open').forEach(f => f.classList.remove('open'));
  }
  // тап мимо папки — пучок закрывается
  addEventListener('click', e => { if (!e.target.closest('.folder')) closeFans(); });

  // обложки встают над папкой шахматкой: по две в ряд, ряды поднимаются вверх
  // и слегка уходят вправо. Если стопка не помещается, она уменьшается и сдвигается целиком.
  function layoutFan(fan) {
    const items = [...fan.children], n = items.length;
    const folder = fan.parentElement;
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    const pad = 12;

    fan.style.setProperty('--k', 1);
    const w = items[0].offsetWidth, h = items[0].offsetHeight;

    const gap = 2.5 * rem;                 // 40px от папки до нижнего ряда
    const colGap = .2 * w, rowGap = .31 * h, lean = .19 * w;
    const cols = n > 1 ? 2 : 1;
    // лёгкий хаос: у каждой карточки свой сдвиг — всегда один и тот же
    const noise = (el, salt) => {
      let h = 2166136261;
      for (const ch of (el.dataset.seed || '') + salt) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
      return ((h >>> 0) % 2000) / 1000 - 1;                        // −1…1
    };
    const pt = i => {
      const row = Math.floor(i / cols), col = i % cols;
      const inRow = Math.min(cols, n - row * cols);                // в верхнем ряду бывает одна
      return {
        x: (col - (inRow - 1) / 2) * (w + colGap) + row * lean + noise(items[i], 'x') * .03 * w,
        y: gap + row * (h + rowGap) + noise(items[i], 'y') * .02 * h,
      };
    };
    const tilt = i => noise(items[i], 'a') * 1.6;

    let top = 0, left = 0, right = 0;
    items.forEach((el, i) => {
      const p = pt(i);
      top = Math.max(top, p.y + h);
      left = Math.min(left, p.x - w / 2);
      right = Math.max(right, p.x + w / 2);
    });

    const available = folder.getBoundingClientRect().top - pad;
    const k = Math.min(1, available / top);
    fan.style.setProperty('--k', k.toFixed(3));

    const originX = fan.getBoundingClientRect().left;
    let shift = Math.min(0, innerWidth - pad - (originX + k * right));
    shift = Math.max(shift, pad - (originX + k * left));

    items.forEach((el, i) => {
      const p = pt(i);
      el.style.setProperty('--x', (k * p.x + shift).toFixed(1) + 'px');
      el.style.setProperty('--y', (k * p.y).toFixed(1) + 'px');
      el.style.setProperty('--a', tilt(i).toFixed(1) + 'deg');
    });
    // невидимый мостик под пучком, чтобы он не закрывался, пока курсор идёт к карточке
    fan.style.setProperty('--h', (k * top + rem).toFixed(1) + 'px');
    fan.style.setProperty('--bl', (k * left + shift - rem).toFixed(1) + 'px');
    fan.style.setProperty('--bw', (k * (right - left) + 2 * rem).toFixed(1) + 'px');
  }

  window.buildFansReady = true;
  buildFans();
  addEventListener('resize', () => document.querySelectorAll('.fan').forEach(layoutFan));

  // резюме шуршит бумагой
  const resume = document.querySelector('.resume');
  resume.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') Sound.play('paper', null, 300); });
  resume.addEventListener('click', () => Sound.play('paper'));

  // мелкие кнопки тихо щёлкают
  // (через делегирование: ссылка на канал пересоздаётся при смене языка)
  document.addEventListener('pointerover', e => {
    const el = e.target.closest('.pill, .toggle, .ext');
    if (el && e.pointerType === 'mouse' && !el.contains(e.relatedTarget)) Sound.play('tick', null, 80);
  });

  // на телефоне подпись «2026, …» живёт внизу страницы, на десктопе — в карточке
  const foot = document.getElementById('foot'), pageFoot = document.getElementById('page-foot');
  const mobile = matchMedia('(max-width: 760px), (max-aspect-ratio: 4/5)');
  const placeFoot = () => (mobile.matches ? pageFoot : document.querySelector('.card-foot'))
    .insertAdjacentElement('afterbegin', foot);
  placeFoot();
  mobile.addEventListener('change', placeFoot);

  // ── Экран кейса ──
  let currentCase = null;
  const caseText = document.getElementById('case-text');
  const caseVideo = document.getElementById('case-video');

  // ── Лента экранов кейса (макет 85:19987 и дальше) ──
  // Экран 1 — устройство с видео, дальше — пары экранов с выносками.
  // Координаты выносок пересчитываются из макета 1400×1080 в проценты.
  const feed = document.getElementById('case-feed'), caseBar = document.getElementById('case-bar');
  const PH = { x: 249, x2: 720.333, y: 97, w: 431.333, h: 885.333 };   // телефон в макете 1400×1080

  function buildFeed(c, t) {
    feed.querySelectorAll('video').forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
    noteRO.disconnect();
    feed.innerHTML = '';
    const screens = (t.screens || c.screens || []);
    document.body.classList.toggle('has-feed', screens.length > 0);
    if (!screens.length) return;

    screens.forEach(sc => {
      const sec = document.createElement('section');
      sec.className = 'case-screen';
      if (sc.title) {                                // заголовок пары — только на телефоне
        const h = document.createElement('h3');
        h.className = 'scr-title';
        h.textContent = sc.title[lang] || sc.title.ru;
        sec.appendChild(h);
      }
      if (sc.hold) sec.classList.add('is-hold');      // экран оставлен пустым — сюда ляжет ролик
      const row = document.createElement('div');
      row.className = 'scr-row';

      if (sc.video) {
        const box = document.createElement('div');
        box.className = 'scr-video';
        box.innerHTML = '<video playsinline muted loop autoplay controls preload="metadata"></video>';
        row.appendChild(box);
        const v = box.querySelector('video');
        v.src = sc.video;
        v.addEventListener('loadeddata', () => v.play().catch(() => {}), { once: true });
      }
      if ((sc.frames || []).length) {                // окна браузера с кадрами интерфейса
        row.className = 'scr-win';
        const st = document.createElement('div'); st.className = 'win-stage';
        const px = (v, base) => (v / base * 100).toFixed(3) + '%';
        const place = (el, o) => {                   // координаты прямо из макета 1400×1080
          el.style.left = px(o.x, 1400); el.style.top = px(o.y, 1080);
          el.style.width = px(o.w, 1400); el.style.height = px(o.h, 1080);
        };
        sc.frames.forEach((f, i) => {                // порядок в массиве — порядок чтения, первое окно сверху
          const el = document.createElement('div');
          el.className = 'win win-img';
          el.style.zIndex = sc.frames.length - i;
          place(el, f);
          el.innerHTML = '<div class="win-bar"><span class="win-dots"><i></i><i></i><i></i></span></div>'
                       + '<img class="win-shot" alt="" loading="lazy">';
          el.querySelector('.win-shot').src = f.src;
          st.appendChild(el);
        });
        if (sc.arrow) {                              // стрелка между окнами
          const a = document.createElement('img');
          a.className = 'stage-arrow'; a.src = sc.arrow.src; a.alt = ''; a.loading = 'lazy';
          a.style.zIndex = sc.frames.length + 1;
          place(a, sc.arrow);
          st.appendChild(a);
        }
        // на компьютере выноски стоят по координатам, на телефоне собираются в ряд «жми»
        const bar = document.createElement('div'); bar.className = 'note-bar';
        (sc.notes || []).forEach(n => {
          const el = document.createElement('div');
          el.className = 'note';
          if (n.r === 'snd') {                                 // правым краем ровно под кнопкой звука
            el.classList.add('at-snd');
          } else if (n.r != null) {                            // r — отступ правого края от края кадра
            el.style.right = px(n.r, 1400); el.style.left = 'auto';
          } else {                                             // x — левый край плашки в макете
            el.style.left = px(n.x, 1400); el.style.right = 'auto';
          }
          el.style.top = px(n.y, 1080);
          el.style.bottom = 'auto';
          el.innerHTML = '<span class="note-text"></span><span class="note-tap"></span>';
          el.querySelector('.note-text').textContent = n[lang] || n.ru;
          el.querySelector('.note-tap').textContent = T[lang].tap;
          bar.appendChild(el);
        });
        if (bar.children.length) st.appendChild(bar);
        row.appendChild(st);
      }
      if ((sc.windows || []).length) {               // окна с текстом исследования
        row.className = 'scr-win';
        const stage = document.createElement('div'); stage.className = 'win-stage';
        sc.windows.forEach(w => {
          const el = document.createElement('div');
          el.className = 'win';
          el.style.left = (w.x / 1400 * 100).toFixed(3) + '%';
          el.style.top = (w.y / 1080 * 100).toFixed(3) + '%';
          el.dataset.y = w.y;
          const items = (w.items || []).map(it => '<p></p>').join('');
          el.innerHTML = '<div class="win-bar"><span class="win-dots"><i></i><i></i><i></i></span>'
                       + '<span class="win-title"></span></div><div class="win-body">' + items + '</div>';
          el.querySelector('.win-title').textContent = w.title[lang] || w.title.ru;
          el.querySelectorAll('.win-body p').forEach((pEl, i) => {
            pEl.textContent = w.items[i][lang] || w.items[i].ru;
          });
          stage.appendChild(el);
        });
        row.appendChild(stage);
      }
      if (sc.laptop) {                               // ноутбук с кадром интерфейса
        const box = document.createElement('div');
        box.className = 'scr-laptop';
        box.innerHTML = '<img class="mb-body" src="assets/macbook.png" alt="">'
                      + '<div class="mb-screen has-shot"><img class="mb-shot" alt=""></div>';
        box.querySelector('.mb-shot').src = sc.laptop;
        row.appendChild(box);
      }
      if ((sc.wide || []).length) {                  // широкий экран: кадры интерфейса + выноска
        row.className = 'scr-wide';
        const stage = document.createElement('div'); stage.className = 'wide-stage';
        const shots = document.createElement('div'); shots.className = 'wide-shots';
        shots.style.setProperty('--shots', sc.wide.length);
        sc.wide.forEach(src => {
          const img = document.createElement('img');
          img.src = src; img.alt = ''; img.loading = 'lazy';
          shots.appendChild(img);
        });
        stage.appendChild(shots);
        if (sc.note) {
          const el = document.createElement('div');
          el.className = 'note';
          el.innerHTML = '<span class="note-text"></span><span class="note-tap"></span>';
          el.querySelector('.note-text').textContent = sc.note[lang] || sc.note.ru;
          el.querySelector('.note-tap').textContent = T[lang].tap;
          stage.appendChild(el);
        }
        row.appendChild(stage);
      }
      const items = [];
      if ((sc.shots || []).length) {
        const pair = document.createElement('div');
        pair.className = 'scr-pair';
        if (sc.phone) {                              // телефон своего размера — иначе 431,33×885,33
          if (sc.phone.h) pair.style.setProperty('--ph-h', sc.phone.h);
          if (sc.phone.ar) pair.style.setProperty('--ph-ar', sc.phone.ar);
          row.classList.add('fit');                  // масштаб считается от ширины всей композиции
          if (sc.span) row.style.setProperty('--span', sc.span);
        }
        if (sc.nw) sec.style.setProperty('--nw', sc.nw);
        sc.shots.forEach(src => {
          const item = document.createElement('div');
          item.className = 'scr-item';
          const img = document.createElement('img');
          if (typeof src === 'object') {              // снимок с запасом вокруг корпуса
            item.classList.add('bleed');
            img.src = src.src;
            item.style.setProperty('--sw', src.w + '%');
            item.style.setProperty('--sx', src.x + '%');
            if (src.y != null) item.style.setProperty('--sy', src.y + '%');
          } else img.src = src;
          img.alt = ''; img.loading = 'lazy';
          item.appendChild(img);
          pair.appendChild(item); items.push(item);
        });
        row.appendChild(pair);
      }
      sec.appendChild(row);

      // выноски у телефонов; у кадров интерфейса они ставятся выше, по координатам макета
      (items.length ? (sc.notes || []) : []).forEach(n => {
        const el = document.createElement('div');
        const tail = n.tail || 'tr';
        el.className = 'note ' + (n.side ? 'p' + (n.at || 0) : (n.at || 'l')) + ' ' + tail;
        // В макете телефон стоит на (249 или 720,333; 97) и занимает 431,333×885,333.
        // Выноску цепляем тем углом, где хвостик, — долей от своего телефона.
        const pc = v => v.toFixed(3) + '%';
        if (n.side) {
          // side — с какой стороны телефона висит выноска, over — на сколько пикселей
          // макета она заходит на экран, y — её верх, считая от верха телефона
          const pw = (sc.phone && sc.phone.w) || PH.w, ph = (sc.phone && sc.phone.h) || PH.h;
          if (n.side === 'r') el.style.setProperty('--nx', pc((pw - n.over) / pw * 100));
          else                el.style.setProperty('--nr', pc((pw - n.over) / pw * 100));
          el.style.setProperty('--ny', pc(n.y / ph * 100));
          el.dataset.py = Math.min(Math.max(n.y / ph, .02), .84);
        } else {
        // выноска заходит на телефон ровно на 40px и дальше растёт наружу;
        // средние цепляются хвостиком за то же место, что и в макете
        if (n.at === 'r') el.style.setProperty('--nx', 'calc(100% - 40px)');
        else if (n.at === 'c') el.style.setProperty('--nr', pc((PH.w - (817 - PH.x)) / PH.w * 100));
        else el.style.setProperty('--nr', 'calc(100% - 40px)');
        if (tail.startsWith('b')) el.style.setProperty('--nb', pc((PH.y + PH.h - (n.y + n.h)) / PH.h * 100));
        else                      el.style.setProperty('--ny', pc((n.y - PH.y) / PH.h * 100));
        // на телефоне выноска всегда по центру, сверху вниз — только доля высоты
        el.dataset.py = Math.min(Math.max((n.y - PH.y) / PH.h, .02), .84);
        }
        el.style.setProperty('--py', (el.dataset.py * 100).toFixed(2) + '%');
        el.innerHTML = '<span class="note-text"></span><span class="note-tap"></span>';
        el.querySelector('.note-text').textContent = n[lang] || n.ru || n.en || '';
        el.querySelector('.note-tap').textContent = T[lang].tap;
        // на телефоне выноска живёт внутри своего экрана, на компьютере — поверх всего кадра
        const host = items.length
          ? (n.side ? (items[n.at || 0] || items[0]) : (n.at === 'r' && items[1] ? items[1] : items[0]))
          : sec;
        host.appendChild(el);
        noteRO.observe(el);
      });
      feed.appendChild(sec);
    });
    typograph(feed);
    feed.scrollTop = 0;
    setBar();
  }

  // Контур выноски — вектор из макета, пересчитанный под размер блока.
  // На компьютере хвостик острым крючком в углу: тело поджимается, остриё выходит на 5,107px.
  // На телефоне — шип по центру верхней грани, 7px глубиной (у «жми» он уже).
  const K = .4477;                                   // плечо скругления
  function shapeNote(el) {
    // дробные размеры: offsetWidth округляет, и остриё, стоящее ровно в углу, срезается
    const box = el.getBoundingClientRect(), w = box.width, h = box.height;
    if (!w || !h) { el.style.clipPath = ''; return; }
    const n2 = v => (Math.round(v * 1000) / 1000);
    if (mobile.matches) {
      const d = 7, B = h - d, r = el.classList.contains('open') ? 20 : 12,
            c = w / 2, hb = el.classList.contains('open') ? 6.624 : 3.816,
            x = v => n2(v), y = v => n2(h - v);      // шип переезжает наверх
      el.style.clipPath = 'path("' +
        `M ${x(r)} ${y(0)} L ${x(w - r)} ${y(0)} ` +
        `C ${x(w - r * K)} ${y(0)}, ${x(w)} ${y(r * K)}, ${x(w)} ${y(r)} ` +
        `L ${x(w)} ${y(B - r)} ` +
        `C ${x(w)} ${y(B - r * K)}, ${x(w - r * K)} ${y(B)}, ${x(w - r)} ${y(B)} ` +
        `L ${x(c + hb)} ${y(B)} ` +
        `C ${x(c + hb * .641)} ${y(B + d * .148)}, ${x(c + hb * .336)} ${y(B + d * .405)}, ${x(c + hb * .140)} ${y(B + d * .739)} ` +
        `C ${x(c + hb * .121)} ${y(B + d * .771)}, ${x(c + hb * .102)} ${y(B + d * .807)}, ${x(c + hb * .064)} ${y(B + d * .879)} ` +
        `L ${x(c)} ${y(B + d)} L ${x(c - hb * .064)} ${y(B + d * .879)} ` +
        `C ${x(c - hb * .102)} ${y(B + d * .807)}, ${x(c - hb * .121)} ${y(B + d * .771)}, ${x(c - hb * .140)} ${y(B + d * .739)} ` +
        `C ${x(c - hb * .336)} ${y(B + d * .405)}, ${x(c - hb * .641)} ${y(B + d * .148)}, ${x(c - hb)} ${y(B)} ` +
        `L ${x(r)} ${y(B)} ` +
        `C ${x(r * K)} ${y(B)}, ${x(0)} ${y(B - r * K)}, ${x(0)} ${y(B - r)} ` +
        `L ${x(0)} ${y(r)} ` +
        `C ${x(0)} ${y(r * K)}, ${x(r * K)} ${y(0)}, ${x(r)} ${y(0)} Z")`;
      return;
    }
    el.style.clipPath = '';          // на компьютере выноска — просто плашка, без уголка
  }
  function shapeNotes() { feed.querySelectorAll('.note').forEach(shapeNote); }

  // Окна в колонке стоят на фиксированном расстоянии: первое — по координате макета,
  // следующие — ровно в 80px под предыдущим, какой бы высоты оно ни получилось.
  function layoutWindows() {
    feed.querySelectorAll('.win-stage').forEach(st => {
      const u = st.offsetWidth / 1400;
      if (!u) return;
      const cols = {};
      st.querySelectorAll('.win:not(.win-img)').forEach(w => {   // окна с кадрами стоят по макету
        const k = w.style.left;
        (cols[k] = cols[k] || []).push(w);
      });
      Object.values(cols).forEach(list => {
        if (!list[0].dataset.y) return;
        list.sort((a, b) => a.dataset.y - b.dataset.y);
        let top = list[0].dataset.y * u;
        list.forEach(w => { w.style.top = Math.round(top) + 'px'; top += w.offsetHeight + 80 * u; });
      });
    });
  }
  addEventListener('resize', layoutWindows);

  // На телефоне выноски раскрываются по тапу и могут налезть друг на друга.
  // Разводим их по высоте телефона так, чтобы хватило места всем раскрытым сразу.
  function layoutNotes() {
    if (!mobile.matches) return;
    feed.querySelectorAll('.scr-item').forEach(item => {
      const ns = [...item.querySelectorAll('.note')], H = item.clientHeight;
      if (!H) return;
      const open = ns.map(n => {                       // высота в раскрытом виде
        const was = n.classList.contains('open');
        n.classList.add('open');
        const hh = n.offsetHeight;
        if (!was) n.classList.remove('open');
        return hh;
      });
      const gap = 12, pad = 8, last = ns.length - 1;
      const top = ns.map(n => +n.dataset.py * H);
      top[0] = Math.max(pad, top[0]);
      for (let i = 1; i <= last; i++) top[i] = Math.max(top[i], top[i - 1] + open[i - 1] + gap);
      const over = top[last] + open[last] - (H - pad);
      if (over > 0) {                                  // не влезли снизу — поджимаем вверх
        top[last] -= over;
        for (let i = last - 1; i >= 0; i--) top[i] = Math.min(top[i], top[i + 1] - open[i] - gap);
      }
      ns.forEach((n, i) => n.style.setProperty('--py', Math.round(Math.max(pad, top[i])) + 'px'));
      ns.forEach(shapeNote);
    });
  }
  addEventListener('resize', layoutNotes);
  // контур пересчитывается, как только выноска меняет размер: при смене окна,
  // раскрытии по тапу, подгрузке шрифта
  const noteRO = new ResizeObserver(es => es.forEach(e => shapeNote(e.target)));
  addEventListener('resize', shapeNotes);
  if (document.fonts) document.fonts.ready.then(shapeNotes);

  function setBar() {
    const max = feed.scrollHeight - feed.clientHeight;
    caseBar.style.setProperty('--p', max > 0 ? (feed.scrollTop / max).toFixed(3) : 0);
  }
  feed.addEventListener('click', e => {
    const n = e.target.closest('.note');
    if (n) { n.classList.toggle('open'); shapeNote(n); }
  });
  feed.addEventListener('scroll', setBar, { passive: true });
  addEventListener('resize', setBar);

  function renderCase(id) {
    const c = CASES[id], t = c && (c[lang] || c.ru || c.en);
    if (!t) return showHome();

    caseText.innerHTML = '';
    t.blocks.forEach(([label, body]) => {
      const sec = document.createElement('section');
      const h = document.createElement('h2'); h.textContent = label;
      const p = document.createElement('p'); p.textContent = body;
      sec.append(h, p); caseText.appendChild(sec);
    });
    typograph(caseText);

    document.getElementById('case-title').textContent = t.title;
    document.getElementById('case-foot').textContent = t.title;
    document.getElementById('mini-case').textContent = t.title;
    document.title = t.title + ' — ' + (lang === 'ru' ? 'Настя Балашова' : 'Nastya Balashova');

    // файлы на столе
    const desk = document.getElementById('case-desk');
    desk.innerHTML = '';
    (c.files || []).forEach(f => {
      const d = DOCS[f.doc], dt = d && (d[lang] || d.ru || d.en);
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'case-file'; el.dataset.doc = f.doc;
      el.style.left = f.x / 16 + 'rem'; el.style.top = f.y / 16 + 'rem';
      el.innerHTML = '<img src="assets/file-green.svg" alt="" draggable="false">';
      const name = document.createElement('span');
      name.textContent = dt ? dt.title : f.doc;
      el.appendChild(name);
      makeDraggable(el);
      desk.appendChild(el);
    });

    // экран макбука: видео, если есть, иначе статичный скрин
    const phone = c.device === 'phone';
    document.body.classList.toggle('phone-case', phone);
    const screen = document.getElementById(phone ? 'ph-screen' : 'mb-screen');
    const video = document.getElementById(phone ? 'case-video-ph' : 'case-video');
    const shot = document.getElementById(phone ? 'case-shot-ph' : 'case-shot');
    screen.classList.toggle('has-video', !!c.video);
    screen.classList.toggle('has-shot', !c.video && !!c.shot);
    document.body.classList.toggle('no-screen', !c.video && !c.shot);  // пустое устройство не показываем
    const other = document.getElementById(phone ? 'case-video' : 'case-video-ph');
    other.pause(); other.removeAttribute('src'); other.load();
    if (c.screens) {                       // видео живёт в ленте — старое устройство глушим
      video.pause(); video.removeAttribute('src'); video.load();
    } else if (c.video) {
      video.src = c.video;
      if (c.poster) video.poster = c.poster;
      video.load();
      // запускаем, когда появились первые кадры: play() сразу после load() браузер отменяет
      video.addEventListener('loadeddata', () => video.play().catch(() => {}), { once: true });
    } else { video.pause(); video.removeAttribute('src'); video.load(); }
    shot.src = !c.video && c.shot ? c.shot : '';

    buildFeed(c, t);

    const plain = !!c.plain;
    document.body.classList.toggle('case-plain', plain);
    if (plain) document.body.classList.remove('collapsed');
    document.getElementById('collapse').setAttribute('aria-label', T[lang].back);

    document.body.dataset.view = 'case';
    layoutNotes();                       // сперва разводим выноски, потом режем контур
    layoutWindows();
    shapeNotes();                        // контур считаем, когда экран уже показан и выноски измерены
    currentCase = id;
    typograph(document.body);
  }

  function showHome() {
    currentCase = null;
    document.body.classList.remove('case-plain');
    document.body.classList.remove('no-screen');
    document.body.dataset.view = 'home';
    document.querySelectorAll('video').forEach(v => v.pause());
    setLang(lang);
  }

  // Адрес меняем осторожно: внутри iframe на claude.ai это может быть запрещено,
  // поэтому переходы делаем прямо на странице, а адрес обновляем «если получится».
  function setHash(value) {
    try { history.pushState({ case: value || null }, '', value ? '#case/' + value : location.pathname + location.search); }
    catch { /* песочница не разрешает менять адрес — не страшно */ }
  }

  function openCase(id) {
    if (!CASES[id]) return;
    closeFans();             // открытый по тапу пучок не должен ждать возвращения
    closeAllDocs();          // файлы принадлежат экрану, с которого их открыли
    renderCase(id);
    setHash(id);
    Sound.play('expand');
  }

  function closeCase() {
    closeAllDocs();
    showHome();
    setHash(null);
    Sound.play('collapse');
  }

  function route() {
    const m = location.hash.match(/^#case\/(\w+)$/);
    if (m && CASES[m[1]]) renderCase(m[1]); else showHome();
  }

  window.caseReady = true;
  addEventListener('popstate', route);
  addEventListener('hashchange', route);
  document.addEventListener('click', e => {
    const opener = e.target.closest('[data-case]');
    if (opener) { e.preventDefault(); openCase(opener.dataset.case); }
  });
  document.getElementById('home-btn').onclick = closeCase;
  route();

  // ── Файлы на «рабочем столе» можно двигать мышкой; короткий клик открывает окно ──
  function makeDraggable(el) {
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch' || e.button !== 0) return;  // на телефоне не мешаем прокрутке
      const box = el.offsetParent || document.body;
      const bRect = box.getBoundingClientRect(), r = el.getBoundingClientRect();
      const dx = e.clientX - r.left, dy = e.clientY - r.top;
      let moved = false;
      el.setPointerCapture(e.pointerId);

      const move = ev => {
        if (!moved && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < 4) return;
        moved = true;
        el.classList.add('dragging');
        const pad = 8;
        const x = Math.max(pad, Math.min(innerWidth - r.width - pad, ev.clientX - dx)) - bRect.left;
        const y = Math.max(pad, Math.min(innerHeight - r.height - pad, ev.clientY - dy)) - bRect.top;
        el.style.left = Math.round(x) + 'px';
        el.style.top = Math.round(y) + 'px';
      };
      const up = () => {
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.classList.remove('dragging');
        // после перетаскивания не открываем окно
        if (moved) el.addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); }, { capture: true, once: true });
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
    });
  }

  // ── Окна с текстом: открываются поверх страницы, их можно открыть несколько,
  //    двигать мышкой за шапку и закрывать крестиком ──
  const docsLayer = document.getElementById('docs');
  const openDocs = new Map();   // id документа → окно
  let docZ = 1, docCascade = 0;

  function fillDoc(win, id) {
    const d = DOCS[id], t = d && (d[lang] || d.ru || d.en);
    if (!t) return;
    win.querySelector('.doc-title').textContent = t.title;
    const body = win.querySelector('.doc-body');
    body.innerHTML = '';
    t.body.split(/\n\s*\n/).forEach(chunk => {
      const head = chunk.match(/^##\s+(.*)$/s);
      const el = document.createElement(head ? 'h3' : 'p');
      el.textContent = head ? head[1] : chunk;
      body.appendChild(el);
    });
    typograph(win);   // заодно и заголовок окна
  }

  function placeDoc(win) {
    const w = win.offsetWidth, h = win.offsetHeight;
    const step = 28 * (docCascade % 6);
    let x = (innerWidth - w) / 2 + step - 70;
    let y = (innerHeight - h) / 2 + step - 70;
    docCascade++;
    moveDoc(win, x, y);
  }

  function moveDoc(win, x, y) {
    const pad = 8;
    x = Math.max(pad, Math.min(innerWidth - win.offsetWidth - pad, x));
    y = Math.max(pad, Math.min(innerHeight - win.offsetHeight - pad, y));
    win.style.left = Math.round(x) + 'px';
    win.style.top = Math.round(y) + 'px';
  }

  function openDoc(id) {
    if (!DOCS[id]) return;
    const exists = openDocs.get(id);
    if (exists) { exists.style.zIndex = ++docZ; return; }   // уже открыт — просто наверх

    const win = document.createElement('div');
    win.className = 'doc-window';
    win.setAttribute('role', 'dialog');
    win.innerHTML = `<div class="doc-bar">
        <span class="doc-title"></span>
        <button class="doc-close" type="button" aria-label="${T[lang].close}"><img src="assets/ic-cross.svg" alt=""></button>
      </div>
      <div class="doc-body"></div>`;
    win.style.zIndex = ++docZ;
    docsLayer.appendChild(win);
    fillDoc(win, id);
    placeDoc(win);
    openDocs.set(id, win);

    win.addEventListener('pointerdown', () => { win.style.zIndex = ++docZ; });
    win.querySelector('.doc-close').onclick = () => closeDoc(id);
    dragDoc(win);
    Sound.play('paper');
  }

  function closeAllDocs() {
    if (window.docReady) [...openDocs.keys()].forEach(id => { openDocs.get(id).remove(); openDocs.delete(id); });
  }

  function closeDoc(id) {
    const win = openDocs.get(id);
    if (!win) return;
    win.remove();
    openDocs.delete(id);
    Sound.play('tick');
  }

  function dragDoc(win) {
    const bar = win.querySelector('.doc-bar');
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      const r = win.getBoundingClientRect();
      const dx = e.clientX - r.left, dy = e.clientY - r.top;
      bar.setPointerCapture(e.pointerId);
      const move = ev => moveDoc(win, ev.clientX - dx, ev.clientY - dy);
      const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
      bar.addEventListener('pointermove', move);
      bar.addEventListener('pointerup', up);
    });
  }

  document.querySelectorAll('.desk-item').forEach(makeDraggable);

  window.docReady = true;
  document.addEventListener('click', e => {
    const opener = e.target.closest('[data-doc]');
    if (opener) { e.preventDefault(); openDoc(opener.dataset.doc); }
  });
  // Esc закрывает верхнее окно
  addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !openDocs.size) return;
    const top = [...openDocs.entries()].sort((a, b) => a[1].style.zIndex - b[1].style.zIndex).pop();
    closeDoc(top[0]);
  });
  addEventListener('resize', () => openDocs.forEach(w => moveDoc(w, w.offsetLeft, w.offsetTop)));

  // кнопка звука
  const snd = document.getElementById('snd');
  const syncSnd = () => snd.setAttribute('aria-pressed', String(Sound.on));
  syncSnd();
  // кнопка выключает звук, только если он сейчас слышен. Пока браузер не отдал звук,
  // любое нажатие его включает — иначе первое нажатие выключало то, чего и так не было
  snd.onclick = () => {
    const heard = Sound.heard;
    Sound.unlock();
    Sound.on = heard ? !Sound.on : true;   // пока ничего не звучало, кнопка только включает
    syncSnd();
    setTimeout(() => Sound.play('tick'), 80);
  };
</script>
</body>
</html>
