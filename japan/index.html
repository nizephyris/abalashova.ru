<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Япония — папка Насти Балашовой</title>
  <meta name="description" content="Личная папка с материалами двухнедельной поездки в Японию.">
  <link rel="icon" type="image/png" href="../assets/icon-32.png">
  <link rel="preload" as="image" href="assets/folder.webp">
  <style>
    :root { color-scheme: dark; background: #080808; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-width: 320px; }
    body { margin: 0; overflow-x: clip; }
    button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
    button:focus-visible { outline: 2px solid #e3bdc0; outline-offset: 4px; }
    main { min-height: 100svh; display: grid; place-items: center; padding: 3rem; }
    .folder {
      position: relative;
      isolation: isolate;
      width: min(70rem, calc((100svh - 10rem) * 1.5), calc(100vw - 6rem));
      min-width: 15rem;
      aspect-ratio: 3 / 2;
      container-type: inline-size;
      perspective: 1800px;
    }
    .folder-body {
      position: absolute;
      inset: 0;
      transform: rotateX(var(--tilt-x, 1deg)) rotateY(var(--tilt-y, -5deg)) rotateZ(-2deg);
      transition: transform .2s ease-out;
    }
    .folder.is-open .folder-body { transform: none; }
    .closed-group { position: absolute; inset: 0; z-index: 3; transform: scale(1.12); transition: transform .25s ease-out; }
    .folder.is-open .closed-group { transform: none; }
    .folder-art {
      position: absolute;
      inset: 0 auto 0 25%;
      width: 50%;
      height: 100%;
      display: block;
      z-index: 2;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 1.5rem 2.5rem #0009);
      transition: opacity .18s;
    }
    .folder.is-open .folder-art { opacity: 0; }
    .cover-open { position: absolute; inset: 8% 29% 3% 31%; z-index: 3; border: 0; border-radius: 1rem; background: transparent; }
    .cover-open:focus-visible { outline-offset: -8px; }
    .spread-cover { position: absolute; inset: 3% 3.5% 1.5%; display: flex; gap: .6%; visibility: hidden; }
    .cover-half {
      width: 50%;
      border: 1px solid #c8818c88;
      border-radius: .7rem;
      background: linear-gradient(135deg, #ffffff0b, transparent 35%, #0008), #210c12;
      box-shadow: inset 0 0 0 2px #782b3b80, inset 0 0 0 5px #100b10, inset 0 0 22px #bf566c28, 0 12px 24px #0009;
    }
    .folder.is-open .spread-cover, .folder.is-open .pages, .folder.is-open .binding { visibility: visible; }
    .tabs {
      position: absolute;
      top: 13%;
      left: 69.5%;
      bottom: 7%;
      z-index: 1;
      width: 3rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      filter: drop-shadow(3px 3px 4px #0005);
    }
    .folder.is-open .tabs { left: 94.5%; top: 8%; bottom: 6%; }
    .tab {
      flex: 1;
      width: 2.75rem;
      min-height: 24px;
      border: 1px solid #ffffff66;
      border-left: 0;
      border-radius: 0 .3rem .3rem 0;
      background: linear-gradient(90deg, #b7b7b7, #f7f7f7 20%, #fff 85%, #e8e8e8);
      box-shadow: inset 0 1px #fff, 0 1px 2px #0005;
      padding: 0;
      transition: transform .15s ease-out;
    }
    .tab[aria-selected="true"] { transform: translateX(.5rem); }
    .tab.papers-tab {
      flex: 1.55;
      min-height: 36px;
      width: 3.5rem;
      background: linear-gradient(90deg, #371117, #73323c 28%, #9c515b);
      border-color: #c3828a66;
      margin-top: .5rem;
      border-radius: 0 .3rem .65rem 0;
    }
    .tab.papers-tab[aria-selected="true"] { transform: translateX(.25rem); }
    .pages { position: absolute; inset: 5.5% 5.5% 4.5%; z-index: 4; perspective: 2000px; perspective-origin: 50% 50%; transform-style: preserve-3d; touch-action: pan-y; visibility: hidden; }
    .left-stack { position: absolute; inset: 0 50% 0 0; }
    .spent-sheet {
      position: absolute;
      left: calc(var(--depth, 0) * -.65px);
      right: 0;
      top: calc(var(--depth, 0) * .25px);
      bottom: calc(var(--depth, 0) * -.4px);
      border-radius: .5rem .1rem .1rem .5rem;
      border: 1px solid #dedede;
      background: linear-gradient(90deg, #f5f5f5, #fff 8%, #fff 91%, #e1e1e1);
      box-shadow: -1px 1px 2px #0003;
      transform-origin: 100% 50%;
      transform: rotateZ(calc(var(--depth, 0) * -.025deg));
    }
    .sheet {
      position: absolute;
      inset: 0 0 0 50%;
      background: linear-gradient(90deg, #e5e5e5, #fff 8%, #fff 94%, #f1f1f1);
      border: 1px solid #fff9;
      border-radius: .15rem .5rem .5rem .15rem;
      box-shadow: -5px 2px 12px #0003, 3px 6px 10px #0005;
      transform-style: preserve-3d;
    }
    .sheet::before, .sheet::after {
      content: "";
      position: absolute;
      inset: .15rem .2rem -.2rem -.15rem;
      border-radius: inherit;
      background: #eee;
      box-shadow: 0 1px 3px #0003;
      transform: translateZ(-1px) rotate(-.6deg);
    }
    .sheet::after { inset: .3rem .4rem -.35rem -.1rem; background: #fff; transform: translateZ(-2px) rotate(.2deg); }
    .turning-leaf {
      position: absolute;
      inset: 0 0 0 50%;
      z-index: 8;
      transform-origin: 0 50%;
      transform-style: preserve-3d;
      pointer-events: none;
      will-change: transform;
    }
    .leaf-face {
      position: absolute;
      inset: 0;
      border-radius: .15rem .5rem .5rem .15rem;
      background: linear-gradient(90deg, #e1e1e1, #fff 12%, #fff 92%, #ededed);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 5px 7px 18px #0004;
      transform: translateZ(.1px);
    }
    .leaf-face.back { transform: rotateY(180deg) translateZ(.1px); border-radius: .5rem .1rem .1rem .5rem; background: linear-gradient(90deg, #f5f5f5, #fff 8%, #fff 91%, #e1e1e1); }
    .leaf-shadow { position: absolute; inset: 0; z-index: 5; background: linear-gradient(90deg, transparent 10%, #0005 50%, transparent 88%); pointer-events: none; opacity: 0; will-change: opacity; }
    .paper-holes { position: absolute; inset: 0 auto 0 clamp(6px, 2.5cqw, 25px); width: clamp(4px, .6cqw, 7px); pointer-events: none; }
    .spent-sheet .paper-holes, .leaf-face.back .paper-holes { left: auto; right: clamp(6px, 2.5cqw, 25px); }
    .paper-holes i { position: absolute; left: 0; top: var(--position); width: 100%; aspect-ratio: 1; border-radius: 50%; background: #252428; box-shadow: 0 0 0 1px #c7c6c6; transform: translateY(-50%); }
    .binding { position: absolute; z-index: 9; left: 50%; top: 5.5%; bottom: 4.5%; width: 3.2%; transform: translateX(-50%); visibility: hidden; pointer-events: none; }
    .spine-plate { position: absolute; inset: 1% 0; border-radius: .35rem; background: linear-gradient(90deg, #242830, #9c9fa5 12%, #363b42 23%, #1c2026 58%, #777d84 86%, #d5d7da 93%, #32363d); box-shadow: 2px 1px 4px #0008; }
    .spine-plate::before, .spine-plate::after { content: ""; position: absolute; top: 1.2%; left: 50%; width: 20%; aspect-ratio: 1; border-radius: 50%; transform: translateX(-50%); background: radial-gradient(circle at 35% 25%, #fff, #808790 45%, #272c34 75%); }
    .spine-plate::after { top: auto; bottom: 1.2%; }
    .ring { position: absolute; top: var(--position); left: 50%; width: 180%; aspect-ratio: 2.7; border: clamp(1.5px, .3cqw, 3px) solid #b7bfc5; border-top-color: #f9fcff; border-right-color: #d8dfe4; border-bottom-color: #7a858e; border-left-color: #616e79; border-radius: 50%; transform: translate(-50%, -50%) rotate(-9deg); box-shadow: 0 2px 2px #0008, inset 0 1px 1px #fff9; }
    .ring::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; border-top: 1px solid #fff; border-bottom: 1px solid #363f48; }
    .folder-controls {
      position: absolute;
      left: 50%;
      top: calc(100% + 1.25rem);
      display: flex;
      gap: 1rem;
      transform: translateX(-50%);
    }
    .folder-controls button { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #fff2; border-radius: 50%; background: #ffffff08; color: #b9adb0; }
    .folder-controls button:hover { background: #ffffff17; color: #fff; }
    .folder-controls button:disabled { opacity: .22; cursor: default; }
    .chevron { width: 8px; height: 8px; border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: rotate(45deg); }
    .previous .chevron { transform: rotate(-135deg); }
    .cross { position: relative; width: 12px; height: 12px; }
    .cross::before, .cross::after { content: ""; position: absolute; left: 5px; height: 13px; width: 1.5px; background: currentColor; transform: rotate(45deg); }
    .cross::after { transform: rotate(-45deg); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 600px) {
      main { padding: 2rem 2.25rem 4rem; }
      .folder { width: calc(100vw - 4.5rem); min-width: 0; }
      .closed-group { transform: scale(1.8); }
      .folder-body { transform: rotateZ(-2deg); }
      .tabs { top: 8%; bottom: 3%; left: 69.5%; width: 1.5rem; }
      .tab { min-height: 0; width: 1.4rem; }
      .tab.papers-tab { width: 1.65rem; min-height: 0; margin-top: .25rem; }
      .tab[aria-selected="true"] { transform: none; }
    }
    @media (max-width: 600px), (max-height: 600px) and (min-width: 601px) {
      .folder.is-open .tabs { display: grid; grid-template-rows: repeat(7, 1fr) 1.35fr; grid-auto-flow: column; grid-template-columns: repeat(2, 1fr); gap: 1px; width: 3rem; }
      .folder.is-open .tab, .folder.is-open .tab[aria-selected="true"] { width: 100%; min-height: 18px; transform: none; }
      .folder.is-open .tab.papers-tab, .folder.is-open .tab.papers-tab[aria-selected="true"] { grid-column: 1 / -1; grid-row: 8; width: 100%; margin: 0; min-height: 24px; transform: none; }
    }
    @media (max-height: 600px) and (max-width: 600px) { .closed-group { transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <h1 class="visually-hidden">Материалы поездки в Японию</h1>
  <main>
    <div class="folder" aria-label="Папка с материалами двух недель в Японии">
      <div class="folder-body">
        <div class="spread-cover" aria-hidden="true"><span class="cover-half"></span><span class="cover-half"></span></div>
        <div class="closed-group">
          <img class="folder-art" src="assets/folder.webp" width="1086" height="1448" alt="Прозрачная бордовая папка с чёрной задней обложкой, белыми листами и металлическими зажимами" fetchpriority="high" draggable="false">
          <button class="cover-open" type="button" aria-label="Открыть папку на первом дне"></button>
          <nav class="tabs" role="tablist" aria-label="Дни поездки и бумажки" aria-orientation="vertical"></nav>
        </div>
        <div class="pages">
          <div class="left-stack" aria-hidden="true"></div>
          <div class="leaf-shadow" hidden aria-hidden="true"></div>
          <div class="turning-leaf" hidden aria-hidden="true">
            <div class="leaf-face"></div>
            <div class="leaf-face back"></div>
          </div>
        </div>
        <div class="binding" aria-hidden="true">
          <span class="spine-plate"></span>
          <span class="ring" style="--position: 6%"></span>
          <span class="ring" style="--position: 23.6%"></span>
          <span class="ring" style="--position: 41.2%"></span>
          <span class="ring" style="--position: 58.8%"></span>
          <span class="ring" style="--position: 76.4%"></span>
          <span class="ring" style="--position: 94%"></span>
        </div>
      </div>
      <nav class="folder-controls" aria-label="Листать папку" hidden>
        <button class="previous" type="button" aria-label="Предыдущий лист"><span class="chevron" aria-hidden="true"></span></button>
        <button class="close" type="button" aria-label="Закрыть папку"><span class="cross" aria-hidden="true"></span></button>
        <button class="next" type="button" aria-label="Следующий лист"><span class="chevron" aria-hidden="true"></span></button>
      </nav>
    </div>
  </main>
  <script>
    const sections = [
      ...Array.from({ length: 14 }, (_, index) => ({ id: `day-${index + 1}`, title: `День ${index + 1}` })),
      { id: 'papers', title: 'Бумажки' },
    ];
    const folder = document.querySelector('.folder');
    const rail = document.querySelector('.tabs');
    const pages = document.querySelector('.pages');
    const cover = document.querySelector('.cover-open');
    const controls = document.querySelector('.folder-controls');
    const previous = controls.querySelector('.previous');
    const next = controls.querySelector('.next');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const tabs = [];
    const panels = [];
    const leaf = pages.querySelector('.turning-leaf');
    const faces = leaf.querySelectorAll('.leaf-face');
    const shadow = pages.querySelector('.leaf-shadow');
    const leftStack = pages.querySelector('.left-stack');
    const spentSheets = [];
    const holePositions = [6, 23.6, 41.2, 58.8, 76.4, 94];
    let selected = -1;
    let visible = -1;
    let activeTurn = null;

    function addHoles(sheet) {
      const holes = document.createElement('span');
      holes.className = 'paper-holes';
      holes.setAttribute('aria-hidden', 'true');
      holePositions.forEach(position => {
        const hole = document.createElement('i');
        hole.style.setProperty('--position', `${position}%`);
        holes.appendChild(hole);
      });
      sheet.appendChild(holes);
    }

    function showPanel(index, leftCount = index) {
      const count = Math.max(0, leftCount);
      spentSheets.forEach((sheet, position) => {
        sheet.hidden = position >= count;
        if (!sheet.hidden) sheet.style.setProperty('--depth', count - position - 1);
      });
      leftStack.setAttribute('data-count', String(count));
      if (index === visible) return;
      if (visible >= 0) panels[visible].hidden = true;
      visible = index;
      if (visible >= 0) panels[visible].hidden = false;
    }

    function stopTurn() {
      const turn = activeTurn;
      activeTurn = null;
      turn?.animations.forEach(animation => animation.cancel());
      leaf.hidden = shadow.hidden = true;
      pages.setAttribute('aria-busy', 'false');
    }

    function turnTo(index) {
      if (index === visible) return;
      if (index < 0 || visible < 0 || reducedMotion.matches) {
        showPanel(index);
        return;
      }
      const from = visible;
      const forward = index > from;
      const turn = { target: index, animations: [] };
      activeTurn = turn;
      pages.setAttribute('aria-busy', 'true');
      // Keep the turned sheets on the left while one leaf crosses the binding.
      if (forward) showPanel(index, from);
      else showPanel(from, index);
      leaf.hidden = shadow.hidden = false;
      const timing = {
        duration: 1000,
        easing: 'cubic-bezier(.35,.08,.25,1)',
        direction: forward ? 'normal' : 'reverse',
        fill: 'both',
      };
      const motion = leaf.animate([
        { transform: 'rotateY(0deg)' },
        { transform: 'rotateY(-92deg)', offset: .55 },
        { transform: 'rotateY(-180deg)' },
      ], timing);
      const shade = shadow.animate([
        { opacity: 0 },
        { opacity: .3, offset: .45 },
        { opacity: 0 },
      ], timing);
      turn.animations = [motion, shade];
      motion.finished.then(() => {
        if (activeTurn !== turn) return;
        showPanel(turn.target);
        stopTurn();
        turnTo(selected);
      }).catch(() => {
        if (activeTurn !== turn) return;
        stopTurn();
        showPanel(selected);
      });
    }

    function select(index, updateHistory = true, animate = true) {
      if (index === selected) return;
      selected = index;
      const open = index >= 0;
      folder.classList.toggle('is-open', open);
      controls.hidden = !open;
      cover.hidden = open;
      previous.disabled = index <= 0;
      next.disabled = index >= sections.length - 1;
      tabs.forEach((tab, position) => {
        const active = position === index;
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active || !open && position === 0 ? 0 : -1;
      });
      if (!open || !animate || reducedMotion.matches) {
        stopTurn();
        showPanel(index);
      } else if (activeTurn) {
        // Finish the current turn sooner, then go straight to the latest selection.
        const speed = index === activeTurn.target ? 1 : 1.5;
        activeTurn.animations.forEach(animation => animation.updatePlaybackRate(speed));
      } else turnTo(index);
      if (updateHistory) {
        const url = new URL(location.href);
        url.hash = open ? sections[index].id : '';
        if (url.href !== location.href) history.pushState(null, '', url);
      }
      document.title = open ? `${sections[index].title} — Япония` : 'Япония — папка Насти Балашовой';
    }

    sections.forEach((section, index) => {
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.className = index === 14 ? 'tab papers-tab' : 'tab';
      tab.id = `tab-${section.id}`;
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-controls', section.id);
      tab.setAttribute('aria-label', section.title);
      tab.setAttribute('aria-selected', 'false');
      tab.tabIndex = index === 0 ? 0 : -1;
      tab.addEventListener('click', () => select(index));
      rail.appendChild(tab);
      tabs.push(tab);
      const panel = document.createElement('article');
      panel.id = section.id;
      panel.className = 'sheet';
      panel.setAttribute('role', 'tabpanel');
      panel.setAttribute('aria-labelledby', tab.id);
      panel.hidden = true;
      addHoles(panel);
      pages.appendChild(panel);
      panels.push(panel);
      if (index < sections.length - 1) {
        const spent = document.createElement('div');
        spent.className = 'spent-sheet';
        spent.style.zIndex = index + 1;
        spent.hidden = true;
        addHoles(spent);
        leftStack.appendChild(spent);
        spentSheets.push(spent);
      }
    });
    faces.forEach(addHoles);

    function closeCover() {
      select(-1);
      cover.focus({ preventScroll: true });
    }
    function route(animate = true) {
      select(sections.findIndex(section => '#' + section.id === location.hash), false, animate);
    }

    rail.addEventListener('keydown', event => {
      const index = tabs.indexOf(event.target);
      if (index < 0) return;
      let target;
      if (event.key === 'ArrowDown' || event.key === 'ArrowRight') target = (index + 1) % tabs.length;
      else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') target = (index + tabs.length - 1) % tabs.length;
      else if (event.key === 'Home') target = 0;
      else if (event.key === 'End') target = tabs.length - 1;
      else return;
      event.preventDefault();
      event.stopPropagation();
      select(target);
      tabs[target].focus({ preventScroll: true });
    });
    cover.addEventListener('click', () => select(0));
    controls.querySelector('.close').addEventListener('click', closeCover);
    previous.addEventListener('click', () => select(selected - 1));
    next.addEventListener('click', () => select(selected + 1));
    addEventListener('keydown', event => {
      if (selected < 0) return;
      if (event.key === 'Escape') closeCover();
      if (event.key === 'ArrowLeft' && selected > 0) { event.preventDefault(); select(selected - 1); }
      if (event.key === 'ArrowRight' && selected < 14) { event.preventDefault(); select(selected + 1); }
    });
    let touchStart = null;
    pages.addEventListener('touchstart', event => {
      const touch = event.touches[0];
      touchStart = { x: touch.clientX, y: touch.clientY };
    }, { passive: true });
    pages.addEventListener('touchend', event => {
      if (!touchStart || selected < 0) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.x;
      const dy = touch.clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
      const target = selected + (dx < 0 ? 1 : -1);
      if (target >= 0 && target < sections.length) select(target);
    }, { passive: true });
    addEventListener('popstate', () => route());
    addEventListener('hashchange', () => route());
    reducedMotion.addEventListener('change', () => {
      if (!reducedMotion.matches) return;
      stopTurn();
      showPanel(selected);
    });
    const movement = matchMedia('(hover: hover) and (pointer: fine)');
    folder.addEventListener('pointermove', event => {
      if (!movement.matches || reducedMotion.matches || selected >= 0) return;
      const bounds = folder.getBoundingClientRect();
      folder.style.setProperty('--tilt-x', `${1 - (event.clientY - bounds.top) / bounds.height * 2}deg`);
      folder.style.setProperty('--tilt-y', `${-5 + (event.clientX - bounds.left) / bounds.width * 4}deg`);
    });
    folder.addEventListener('pointerleave', () => {
      folder.style.removeProperty('--tilt-x');
      folder.style.removeProperty('--tilt-y');
    });
    route(false);
  </script>
</body>
</html>
